<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garaje Trujillo · Taller</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1520">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Taller Trujillo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--bg:#0b0c0e;--p1:#131518;--p2:#1a1d21;--ln:#262a30;--tx:#eef0f2;--mu:#8b929b;--y:#f5b82e;--y2:#ffcf4a;--g:#3fbf5f;--b:#3b82f6;--r:#ef4444;--rad:16px}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.bb{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.5px;font-weight:400;line-height:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid var(--ln);background:var(--p2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#3a4048}
.btn:disabled{opacity:.6;cursor:wait}
.btn.y{background:var(--y);color:#111;border-color:var(--y)}.btn.y:hover{background:var(--y2)}
.btn.g{background:var(--g);color:#06210f;border-color:var(--g)}
.btn.bl{background:var(--b);border-color:var(--b);color:#fff}
.btn.big{padding:15px 22px;font-size:16px;width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.btn.danger{color:#ff8a8a;border-color:#4a2224;background:transparent}
.lk{color:var(--y);text-decoration:underline;font-size:inherit}
.hint{color:var(--mu);font-size:13.5px}
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border-radius:4px;font-weight:700;font-size:12px;letter-spacing:.8px;overflow:hidden;line-height:1;font-family:ui-monospace,Menlo,Consolas,monospace;vertical-align:middle}
.plate:before{content:'';width:5px;background:#1d4ed8}
.plate span{padding:3px 6px}
/* NAV */
.nav{position:sticky;top:0;z-index:20;background:rgba(11,12,14,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-ic{width:34px;height:34px;border-radius:9px;background:var(--y);display:grid;place-items:center;color:#111;flex:none}
.logo b{font-family:'Bebas Neue';font-weight:400;font-size:22px;letter-spacing:.8px;line-height:1;display:block}
.logo small{display:block;font-size:9.5px;color:var(--mu);letter-spacing:1.5px;text-transform:uppercase}
.nav-links{display:flex;gap:22px;margin-left:auto;font-size:14px;color:var(--mu)}
.nav-links a{text-decoration:none}.nav-links a:hover{color:var(--tx)}
.nav .btn{padding:9px 16px}
.nav-taller{font-size:13px;color:var(--mu);text-decoration:none;display:flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:9px;padding:8px 11px}
.nav-taller:hover{color:var(--tx)}
@media(max-width:520px){.logo .lg-l{display:none}.logo b{font-size:20px}}
@media(max-width:900px){.nav-links{display:none}.nav .wrap{gap:10px}.nav-taller span{display:none}.nav .btn.y{margin-left:auto}.logo small{display:none}}
/* HERO */
.hero{padding:26px 0 0}
.hero-card{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(120% 120% at 85% 30%,#24211a 0,#121316 45%,#0e0f11 100%);border:1px solid var(--ln);padding:56px;display:grid;grid-template-columns:1.25fr .9fr;gap:30px;align-items:center}
.hero-card:before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 70% 50%,#000 20%,transparent 75%);pointer-events:none}
.hero-card>*{position:relative}
.kicker{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mu);font-weight:600}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 12px var(--y);flex:none}
.hero h1{font-size:clamp(50px,7.2vw,94px);margin:18px 0 20px}
.hero h1 em,.s-h h2 em{font-style:normal;color:var(--y)}
.lead{color:#b4bac2;max-width:540px;font-size:16.5px}
.hero-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.gauge-w{position:relative;justify-self:center;width:min(360px,100%)}
.gauge-w svg{width:100%;height:auto;display:block}
.chip-f{position:absolute;background:rgba(20,22,25,.92);border:1px solid var(--ln);border-radius:10px;padding:7px 11px;font-size:12.5px;color:#cfd4da;white-space:nowrap}
.chip-f b{color:var(--tx)}
.chip-f.ok{color:var(--g)}
@media(max-width:860px){.hero-card{grid-template-columns:1fr;padding:34px 22px;border-radius:22px}.gauge-w{width:min(290px,88%)}}
/* SECTIONS */
section.s{padding:76px 0 0}
.s-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.s-h h2{font-size:clamp(40px,5vw,60px)}
.s-h p{color:var(--mu);max-width:440px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid3{grid-template-columns:1fr}}
.svc{background:var(--p1);border:1px solid var(--ln);border-radius:var(--rad);padding:22px;transition:.2s}
.svc:hover{border-color:#40391f;transform:translateY(-2px)}
.ic-b{width:44px;height:44px;border-radius:12px;background:rgba(245,184,46,.12);color:var(--y);display:grid;place-items:center;margin-bottom:16px}
.svc h3{font-size:17px;margin-bottom:6px}
.svc p{color:var(--mu);font-size:14px}
.camper{margin-top:14px;border-radius:22px;border:1px solid #3a3320;background:linear-gradient(120deg,#1d1a10,#131416 60%);padding:34px;display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center}
.camper h3{font-size:44px;margin:12px 0 10px}
.camper p{color:#b4bac2}
.camper ul{list-style:none;display:grid;gap:12px}
.camper li{display:flex;gap:10px;align-items:center;color:#d6dadf}
.camper li svg{color:var(--y);flex:none}
@media(max-width:760px){.camper{grid-template-columns:1fr;padding:24px}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.step{background:var(--p1);border:1px solid var(--ln);border-radius:var(--rad);padding:24px}
.step .n{font-family:'Bebas Neue';font-size:54px;color:var(--y);line-height:1}
.step h3{font-size:18px;margin:6px 0}
.step p{color:var(--mu);font-size:14px}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
/* BOOKING */
.book{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px}
.book-side{background:var(--p1);border:1px solid var(--ln);border-radius:22px;padding:28px;align-self:start;position:sticky;top:84px}
.book-side h2{font-size:54px;margin-bottom:12px}
.book-side h2 em{font-style:normal;color:var(--y)}
.book-side ul{list-style:none;display:grid;gap:12px;margin-top:20px;color:#cfd4da;font-size:14.5px}
.book-side li{display:flex;gap:10px}
.book-side li svg{color:var(--g);flex:none;margin-top:2px}
.form{background:var(--p1);border:1px solid var(--ln);border-radius:22px;padding:28px}
.fld{margin-bottom:18px}
.lbl{display:block;font-size:13px;font-weight:600;color:#c9ced4;margin-bottom:8px}
.inp,.form input[type=text],.form input[type=tel],.form textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;outline:none;transition:.15s}
.inp:focus,.form input:focus,.form textarea:focus{border-color:var(--y)}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.form,.book-side{padding:20px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{padding:9px 13px;border-radius:999px;border:1px solid var(--ln);background:var(--bg);font-size:13.5px;color:#cfd4da}
.chipb.on{background:var(--y);color:#111;border-color:var(--y);font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:none;width:66px;padding:10px 0;border-radius:12px;border:1px solid var(--ln);background:var(--bg);text-align:center}
.day small{display:block;font-size:11px;text-transform:uppercase;color:var(--mu);letter-spacing:1px}
.day b{display:block;font-size:24px;font-family:'Bebas Neue';font-weight:400;letter-spacing:1px;line-height:1.1}
.day.on{border-color:var(--y);background:rgba(245,184,46,.12)}
.day.on small{color:var(--y)}
.day:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{padding:10px 0;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-weight:600;font-size:14px}
.slot small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
.slot.on{background:var(--y);color:#111;border-color:var(--y)}
.slot.on small{color:#3a2c00}
.slot:disabled{opacity:.35;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mu);margin:4px 0 18px}
.chk input{margin-top:3px;accent-color:var(--y);width:16px;height:16px;flex:none}
.err{color:#ff8a8a;font-size:14px;margin-top:10px}
.ok-card{text-align:center;padding:16px 4px}
.ok-ic{width:64px;height:64px;border-radius:50%;background:rgba(63,191,95,.15);color:var(--g);display:grid;place-items:center;margin:0 auto 14px}
.ok-card h3{font-family:'Bebas Neue';font-size:44px;font-weight:400}
.sum{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:18px 0;text-align:left;display:grid;gap:8px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum div>span{color:var(--mu)}
@media(max-width:860px){.book{grid-template-columns:minmax(0,1fr)}.book-side{position:static}}
/* ESTADO */
.estado{background:var(--p1);border:1px solid var(--ln);border-radius:22px;padding:30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
.estado h2{font-size:clamp(40px,5vw,54px);margin:12px 0 10px}
.estado h2 em{font-style:normal;color:var(--y)}
.estado-f{display:flex;gap:10px;margin-top:20px}
.estado-f input{flex:1;min-width:0;text-transform:uppercase;font-weight:600;letter-spacing:1px}
.res-box{background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:22px;min-height:150px}
.res-box h4{font-size:17px;margin-bottom:4px}
.tl{margin-top:18px}
.tl-i{display:flex;gap:14px;position:relative;padding-bottom:22px}
.tl-i:last-child{padding-bottom:0}
.tl-i:not(:last-child):after{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--ln)}
.tl-i.done:not(:last-child):after{background:var(--g)}
.tl-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;flex:none;background:var(--bg)}
.tl-i.done .tl-dot{background:var(--g);border-color:var(--g);color:#06210f}
.tl-i.now .tl-dot{border-color:var(--b);box-shadow:0 0 0 5px rgba(59,130,246,.18)}
.tl-i.now .tl-dot:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--b)}
.tl-i b{display:block;font-size:15px}
.tl-i small{color:var(--mu)}
.ready{margin-top:18px;background:rgba(63,191,95,.12);border:1px solid #1f4a2e;color:#7be59b;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
@media(max-width:760px){.estado{grid-template-columns:minmax(0,1fr);padding:22px}}
/* FOOTER */
.foot{margin-top:84px;border-top:1px solid var(--ln);padding:40px 0 70px;color:var(--mu);font-size:14px}
.foot .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:26px}
.foot h4{color:var(--tx);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:10px}
.foot p{margin-bottom:6px}
.foot a{text-decoration:none}.foot a:hover{color:var(--tx)}
@media(max-width:760px){.foot .wrap{grid-template-columns:1fr}}
.wa-float{position:fixed;right:18px;bottom:18px;z-index:30;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);color:#fff}
body.in-app .wa-float{display:none}
/* APP */
.app-loading{display:grid;place-items:center;min-height:100vh;color:var(--mu)}
.app-h{position:sticky;top:0;z-index:20;background:rgba(11,12,14,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:16px;padding:10px 20px}
.app-brand{display:flex;align-items:center;gap:10px}
.app-brand b{font-family:'Bebas Neue';font-weight:400;font-size:21px;letter-spacing:.8px;display:block;line-height:1}
.app-brand small{font-size:11px;color:var(--mu)}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;font-size:13.5px;color:var(--mu);position:relative}
.tab:hover{color:var(--tx)}
.tab.on{background:rgba(245,184,46,.12);color:var(--y)}
.badge{font-style:normal;background:var(--r);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;line-height:1.4}
.app-h-r{display:flex;align-items:center;gap:12px}
.lnk{font-size:13px;color:var(--mu);text-decoration:none}.lnk:hover{color:var(--tx)}
.me{width:36px;height:36px;border-radius:50%;background:var(--c);color:#111;font-weight:700}
.app-main{max-width:1240px;margin:0 auto;padding:22px 20px 110px}
@media(max-width:860px){
 .app-h{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
 .tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:rgba(15,16,19,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:25}
 .tab{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 2px;flex:1}
 .tab .badge{position:absolute;top:0;left:calc(50% + 4px)}
 .app-h-r{margin-left:auto}
 .app-h{padding:10px 16px}
 .app-main{padding:18px 14px 110px}
}
.v-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.v-h h1{font-family:'Bebas Neue';font-weight:400;font-size:42px;letter-spacing:.6px;line-height:1}
.v-h p{color:var(--mu);font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:'Bebas Neue';font-size:42px;line-height:1;font-weight:400}
.stat span{color:var(--mu);font-size:13.5px}
.sec-t{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin:24px 0 10px;font-weight:600}
.sec-t i{font-style:normal;background:var(--p2);border-radius:999px;padding:0 8px;font-size:12px}
.list{display:grid;gap:10px}
.list.cols{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.job{background:var(--p1);border:1px solid var(--ln);border-left:4px solid var(--y);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.job:hover{border-color:#3a4048;border-left-color:var(--y)}
.job.st-en_curso,.job.st-en_curso:hover{border-left-color:var(--b)}
.job.urg,.job.urg:hover{border-left-color:var(--r)}
.job.st-hecho,.job.st-hecho:hover{border-left-color:var(--g);opacity:.78}
.job-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job-top b{font-size:16px;line-height:1.3}
.tag-urg{font-size:11px;font-weight:700;letter-spacing:.8px;color:#ff8a8a;background:rgba(239,68,68,.13);border-radius:6px;padding:3px 7px;flex:none}
.job-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--mu);font-size:13px;margin-top:8px}
.job-meta>span{display:inline-flex;align-items:center;gap:5px}
.st-pill{font-weight:600}
.st-pill.por_hacer{color:var(--y)}.st-pill.en_curso{color:#5b9bff}.st-pill.hecho{color:var(--g)}
.st-pill:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor}
.job-acts{display:flex;gap:8px;margin-top:12px}
.job-acts .btn{flex:1;padding:10px}
.empty{border:1px dashed var(--ln);border-radius:14px;padding:20px;text-align:center;color:var(--mu);font-size:14px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x mandatory}
.col{flex:0 0 300px;background:#101114;border:1px solid var(--ln);border-radius:16px;padding:12px;scroll-snap-align:start}
@media(max-width:560px){.col{flex-basis:86%}}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.col-h small{margin-left:auto;color:var(--mu);font-weight:400;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,#666);flex:none}
.col .job{padding:12px}
.col .job-top b{font-size:14.5px}
.cita{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:16px;display:grid;gap:10px}
.cita-when{display:flex;align-items:center;gap:12px}
.when{background:rgba(245,184,46,.12);color:var(--y);border-radius:10px;padding:6px 10px;text-align:center;line-height:1.1;flex:none;min-width:70px}
.when b{display:block;font-family:'Bebas Neue';font-size:24px;font-weight:400}
.when small{font-size:11px;text-transform:uppercase;letter-spacing:1px}
.cita p{color:#c9ced4;font-size:14px}
.cita .job-meta{margin-top:0}
.hist{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);font-size:14px}
.hist:last-child{border-bottom:0}
.hist span{color:var(--mu);font-size:13px;margin-left:auto;white-space:nowrap}
.hist-w{background:var(--p1);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.worker{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--c);color:#111;font-weight:700;display:grid;place-items:center;flex:none;font-size:17px}
.w-n{font-weight:600}
.w-n small{font-weight:600;font-size:11px;color:var(--y);background:rgba(245,184,46,.12);border-radius:6px;padding:2px 6px;margin-left:6px;letter-spacing:.5px}
.w-st{display:flex;gap:14px;color:var(--mu);font-size:13px;margin-top:3px;flex-wrap:wrap}
.w-st b{color:var(--tx)}
.worker .btn{margin-left:auto}
.add-w{display:flex;gap:8px;margin-top:14px}
.add-w .inp{flex:1;min-width:0}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}

  if(error){toast(T('No se pudo guardar. Revisa la conexión.'));throw error}
  const arr=S[col],i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]={...body,id};else arr.push({...body,id});
  onData();return;
 }
 if(MODE==='db'){
  const body={...data};delete body.id;
  const ref=DB.collection(col).doc(id);
  try{merge?await ref.update(body):await ref.set(body)}
  catch(e){toast(e&&e.code==='invalid_argument'?'No tienes permiso para guardar cambios':'No se pudo guardar. Reintenta.');throw e}
  return;
 }
 const arr=S[col],i=arr.findIndex(x=>x.id===id);
 if(merge&&i>=0)arr[i]={...arr[i],...data};else if(i>=0)arr[i]={...data,id};else arr.push({...data,id});
 saveLocal();onData();
}
const patch=(col,id,d)=>writeDoc(col,id,d,true);
async function removeDoc(col,id){
 if(MODE==='sb'){const {error}=await SB.from('trj_'+col).delete().eq('id',id);if(error){toast(T('No se pudo borrar'));throw error}S[col]=S[col].filter(x=>x.id!==id);onData();return}
 if(MODE==='db'){try{await DB.collection(col).doc(id).delete()}catch(e){toast(T('No se pudo borrar'));throw e}return}
 S[col]=S[col].filter(x=>x.id!==id);saveLocal();onData();
}

   if(p.eventType==='DELETE'){S[t]=S[t].filter(x=>x.id!==(p.old&&p.old.id))}
   else if(p.new&&p.new.id){const row={...p.new.data,id:p.new.id},i=S[t].findIndex(x=>x.id===row.id);if(i>=0)S[t][i]=row;else S[t].push(row)}
   onData();
  }));

}

 }

 }
}

function slotCount(day,h){if(MODE==='sb')return HUECOS[day+'|'+h]||0;return S.citas.filter(c=>c.fecha===day&&c.hora===h&&c.estado!=='rechazada').length}
function slotPast(day,h){if(day!==today())return false;const[H,M]=h.split(':').map(Number);const n=new Date();return H*60+M<=n.getHours()*60+n.getMinutes()+60}
function freeSlots(day){return CONFIG.horas.filter(h=>!slotPast(day,h)&&slotCount(day,h)<CONFIG.capacidadPorHora).length}
function bookDays(){const out=[];let d=new Date();for(let i=0;out.length<CONFIG.diasVista&&i<40;i++){if(CONFIG.diasLaborables.includes(d.getDay()))out.push(ymd(d));d=addDays(d,1)}return out}
function renderDays(){
 const el=$('#bk-days');if(!el)return;
 const days=bookDays();
 if(!BK.day||!days.includes(BK.day)||!freeSlots(BK.day))BK.day=days.find(d=>freeSlots(d))||'';
 el.innerHTML=days.map(d=>{const dt=parseYmd(d),full=!freeSlots(d);return `<button type="button" class="day ${BK.day===d?'on':''}" data-day="${d}" ${full?'disabled':''}><small>${d===today()?'hoy':DIAS[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${full?'lleno':MESES[dt.getMonth()]}</small></button>`}).join('');
}
function renderSlots(){
 const el=$('#bk-slots');if(!el)return;
 if(!BK.day){el.innerHTML='<p class="hint">No quedan huecos libres estos días. Llámanos.</p>';return}
 if(BK.slot&&(slotPast(BK.day,BK.slot)||slotCount(BK.day,BK.slot)>=CONFIG.capacidadPorHora))BK.slot='';
 el.innerHTML=CONFIG.horas.map(h=>{const n=slotCount(BK.day,h),past=slotPast(BK.day,h),full=n>=CONFIG.capacidadPorHora,dis=past||full;
  return `<button type="button" class="slot ${BK.slot===h?'on':''}" data-slot="${h}" ${dis?'disabled':''}>${h}<small>${past?'—':full?'Completo':'Libre'}</small></button>`}).join('');
}

function openModal(m){MODAL=m;DEL_ARM=null;renderModal()}
function closeModal(){MODAL=null;DEL_ARM=null;$('#modal-root').innerHTML=''}
function renderModal(){
 if(!MODAL)return;const root=$('#modal-root');
 const keep={};root.querySelectorAll('[data-keep]').forEach(el=>keep[el.dataset.keep]=el.value);
 const prevScroll=root.querySelector('.sheet')?.scrollTop||0;
 const fresh=!root.firstChild;
 let html='';
 if(MODAL.kind==='job')html=modalJob(S.trabajos.find(x=>x.id===MODAL.id));
 else if(MODAL.kind==='new'){if(!fresh)return;html=modalNew()}
 else if(MODAL.kind==='cita'){if(!fresh&&S.citas.some(x=>x.id===MODAL.id))return;html=modalCita(S.citas.find(x=>x.id===MODAL.id))}
 else if(MODAL.kind==='cuenta')html=modalCuenta();
 root.innerHTML=`<div class="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
 if(!fresh)root.querySelector('.ov').style.animation='none',root.querySelector('.sheet').style.animation='none';
 root.querySelectorAll('[data-keep]').forEach(el=>{if(keep[el.dataset.keep])el.value=keep[el.dataset.keep]});
 root.querySelector('.sheet').scrollTop=prevScroll;
}

function setUser(id){ME_ID=id;lsSet(USERKEY,id);closeModal();renderApp();const w=worker(id);if(w)toast(T('Hola, ')+w.nombre)}
async function act(k,ds){
 const me=currentUser(),now=new Date().toISOString();
 const t=ds.id?S.trabajos.find(x=>x.id===ds.id):null;
 const needT=['start','done','take','set-estado','urg','nota','del'];
 if(needT.includes(k)&&!t)return;
 switch(k){
  case 'close':closeModal();break;
  case 'new':openModal({kind:'new'});break;
  case 'start':await patch('trabajos',t.id,{estado:'en_curso',asignado:asig(t)||me.id});toast(T('Trabajo en curso'));break;
  case 'done':await patch('trabajos',t.id,{estado:'hecho',hechoEn:now,asignado:asig(t)||me.id});toast(T('✓ Trabajo marcado como hecho'));break;
  case 'take':await patch('trabajos',t.id,{asignado:me.id});toast(T('Añadido a tus trabajos'));break;
  case 'set-estado':{const v=ds.v;if(v===t.estado)break;const d={estado:v,hechoEn:v==='hecho'?now:null};if(v!=='por_hacer'&&!asig(t))d.asignado=me.id;await patch('trabajos',t.id,d);break}
  case 'urg':await patch('trabajos',t.id,{urgente:!t.urgente});break;
  case 'nota':{const ta=$('#modal-root textarea[data-keep="nota"]'),txt=ta?ta.value.trim():'';if(!txt)return;ta.value='';await patch('trabajos',t.id,{notas:[...(t.notas||[]),{autor:me.nombre,texto:txt,ts:now}]});break}
  case 'del':
   if(DEL_ARM!==t.id){DEL_ARM=t.id;renderModal();setTimeout(()=>{if(DEL_ARM===t.id){DEL_ARM=null;renderModal()}},4000);return}
   DEL_ARM=null;closeModal();await removeDoc('trabajos',t.id);toast(T('Trabajo eliminado'));break;
  case 'cita':openModal({kind:'cita',id:ds.id});break;
  case 'cita-rech':closeModal();await patch('citas',ds.id,{estado:'rechazada'});toast(T('Cita rechazada'));break;
  case 'cuenta':openModal({kind:'cuenta'});break;
  case 'logout':ME_ID=null;lsSet(USERKEY,null);closeModal();renderApp();break;
  case 'sb-out':ME_ID=null;lsSet(USERKEY,null);closeModal();await SB.auth.signOut();renderApp();break;
  case 'rm-worker':{
   if(RM_ARM!==ds.id){RM_ARM=ds.id;renderApp();setTimeout(()=>{if(RM_ARM===ds.id){RM_ARM=null;renderApp()}},4000);return}
   RM_ARM=null;const open=S.trabajos.filter(x=>x.asignado===ds.id&&isOpen(x));
   for(const x of open)await patch('trabajos',x.id,{asignado:''});
   await removeDoc('equipo',ds.id);toast(T('Técnico quitado del equipo'));break}
 }
}
document.addEventListener('click',e=>{
 if(e.target.classList&&e.target.classList.contains('ov')){closeModal();return}
 const tab=e.target.closest('[data-tab]');
 if(tab){TAB=tab.dataset.tab;lsSet('trj_tab',TAB);RM_ARM=null;renderApp();window.scrollTo(0,0);return}
 const sl=e.target.closest('[data-setlang]');if(sl){setLang(sl.dataset.setlang);return}
 const lg=e.target.closest('[data-login]');if(lg){setUser(lg.dataset.login);return}
 const a=e.target.closest('[data-act]');
 if(a){act(a.dataset.act,a.dataset).catch(()=>{});return}
 const o=e.target.closest('[data-open]');
 if(o)openModal({kind:'job',id:o.dataset.open});
});
document.addEventListener('change',e=>{
 const f=e.target.closest('[data-field]');if(!f)return;
 const t=S.trabajos.find(x=>x.id===f.dataset.id);if(!t)return;
 const v=f.value.trim();if((t[f.dataset.field]||'')===v)return;
 patch('trabajos',t.id,{[f.dataset.field]:v}).then(()=>toast(T('Guardado'))).catch(()=>{});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal()});
document.addEventListener('submit',async e=>{
 const f=e.target;
 if(f.id==='f-sblogin'){e.preventDefault();const b=f.querySelector('button');b.disabled=true;b.textContent=T('Entrando…');
  const {data,error}=await SB.auth.signInWithPassword({email:f.email.value.trim().toLowerCase(),password:f.pass.value});
  if(error){b.disabled=false;b.textContent=T('Entrar');f.querySelector('.err').textContent=T('Correo o contraseña incorrectos.');return}
  SESSION=data.session;READY=false;renderApp();await sbStart();READY=true;renderApp();return}
 if(!['f-new','f-cita','f-addw','f-first'].includes(f.id))return;
 e.preventDefault();
 const fd=new FormData(f),v=k=>String(fd.get(k)||'').trim(),now=new Date().toISOString();
 const btn=f.querySelector('button');if(btn)btn.disabled=true;
 try{
  if(f.id==='f-new'){
   if(!v('titulo')){btn.disabled=false;return}
   const me=currentUser();
   await writeDoc('trabajos',uid('t'),{titulo:v('titulo'),vehiculo:v('vehiculo'),matricula:v('matricula').toUpperCase(),cliente:v('cliente'),telefono:v('telefono'),asignado:v('asignado'),estado:'por_hacer',urgente:!!fd.get('urgente'),fecha:v('fecha')||today(),notas:v('nota')?[{autor:me.nombre,texto:v('nota'),ts:now}]:[],creado:now});
   closeModal();toast(T('Trabajo creado'));
  }
  if(f.id==='f-cita'){
   const c=S.citas.find(x=>x.id===f.dataset.id);if(!c)return closeModal();
   const notas=c.descripcion?[{autor:c.nombre+' (cliente, web)',texto:c.descripcion,ts:c.creada||now}]:[];
   await writeDoc('trabajos',uid('t'),{titulo:v('titulo')||c.servicio,vehiculo:c.vehiculo,matricula:c.matricula,cliente:c.nombre,telefono:c.telefono,asignado:v('asignado'),estado:'por_hacer',urgente:!!fd.get('urgente'),fecha:c.fecha,hora:c.hora,origen:'web',citaId:c.id,notas,creado:now});
   await patch('citas',c.id,{estado:'convertida'});
   closeModal();toast(T('Trabajo creado a partir de la cita'));
  }
  if(f.id==='f-addw'){
   const n=v('n');if(!n){btn.disabled=false;return}
   await writeDoc('equipo',uid('w'),{nombre:n,rol:'tecnico',color:['#e879f9','#f97316','#22d3ee','#a3e635','#f472b6','#3fbf5f','#3b82f6'][S.equipo.length%7],orden:S.equipo.length});
   toast(n+T(' añadido al equipo'));
  }
  if(f.id==='f-first'){
   const n=v('n');if(!n){btn.disabled=false;return}
   const id=uid('w');await writeDoc('equipo',id,{nombre:n,rol:'jefe',color:'#e5483e',orden:0});setUser(id);
  }
 }catch(err){if(btn)btn.disabled=false}
});

const AS={open:false,msgs:[],busy:false};
const AS_CHIPS=['Mi coche no arranca','Se enciende un testigo','¿Instaláis placas en campers?','El aire no enfría','¿Cuánto cuesta?'];
function asReglas(t){
 const n=t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(),h=ks=>ks.some(k=>n.includes(k));
 if(h(['humo','quemado','chispa']))return{reply:`Si hay humo, chispas u olor a quemado, para el vehículo, quita el contacto y no lo uses hasta revisarlo. Llámanos al ${CONFIG.telefono}.`,servicio:'Diagnosis / testigo encendido'};
 if(h(['precio','cuesta','cuanto','presupuesto']))return{reply:'Depende de lo que tenga: primero lo diagnosticamos y te damos el presupuesto antes de tocar nada.',servicio:null};
 if(h(['no arranca','bateria']))return{reply:'Suele ser la batería, un consumo que la descarga o el motor de arranque. Tráelo y lo comprobamos.',servicio:'No arranca / batería'};
 if(h(['alternador','no carga']))return{reply:'Si se enciende el testigo de batería o no carga, lo normal es revisar el alternador y la correa.',servicio:'Alternador / no carga'};
 if(h(['aire','clima','enfria']))return{reply:'Revisamos el aire acondicionado: carga de gas, fugas y fallos eléctricos.',servicio:'Climatización / aire'};
 if(h(['luz','luces','faro','piloto']))return{reply:'Arreglamos faros, pilotos y cableados de iluminación.',servicio:'Luces / iluminación'};
 if(h(['camper','furgo','placa','solar','litio']))return{reply:'Montamos la instalación eléctrica de furgonetas y campers: placas solares, baterías auxiliares y de litio, inversores y más.',servicio:'Furgoneta / camper'};
 if(h(['testigo','centralita','fallo','averia']))return{reply:'Hacemos diagnosis electrónica con equipos actualizados para encontrar el origen del fallo.',servicio:'Diagnosis / testigo encendido'};
 return{reply:'Somos especialistas en electricidad del automóvil: diagnosis, baterías, alternadores, arranques, climatización, luces y campers. Cuéntame qué le pasa.',servicio:null};
}
function asRender(){
 let el=$('#as');
 if(!AS.open){if(el)el.remove();document.body.classList.remove('as-open');return}
 document.body.classList.add('as-open');
 if(!el){el=document.createElement('div');el.id='as';el.className='as';el.setAttribute('role','dialog');el.setAttribute('aria-label','Asistente del taller');document.body.appendChild(el);
  el.innerHTML=`<div class="as-h"><span class="logo-ic">${sv(P.bolt,18)}</span><div style="flex:1"><b>Asistente de Roberto</b><small>● Responde al momento</small></div><button class="x" id="as-x" aria-label="Cerrar">${sv(P.x,16)}</button></div><div class="as-m" id="as-m"></div><div class="as-chips" id="as-chips"></div><form class="as-f" id="as-f"><input id="as-in" placeholder="Cuéntame qué le pasa…" autocomplete="off" maxlength="500"><button id="as-send" aria-label="Enviar">${sv(P.arrow,18)}</button></form>`;}
 const m=$('#as-m');
 m.innerHTML=`<div class="bub bot">¡Hola! Soy el asistente de ${esc(CONFIG.nombre)}. Cuéntame qué le pasa a tu coche, furgo o camper y te digo si te podemos ayudar.</div>`+
  AS.msgs.map(x=>x.role==='user'?`<div class="bub usr">${esc(x.content)}</div>`:`<div class="bub bot">${esc(x.content)}</div>${x.servicio?`<div class="as-cta"><button class="btn y sm" data-as-cita="${esc(x.servicio)}">${sv(P.cal,15)} Pedir cita: ${esc(x.servicio)}</button></div>`:''}`).join('')+
  (AS.busy?'<div class="bub bot typ">Escribiendo…</div>':'');
 m.scrollTop=m.scrollHeight;
 $('#as-chips').innerHTML=AS.msgs.length?'':AS_CHIPS.map(c=>`<button class="chipb" data-as-chip="${esc(c)}">${esc(c)}</button>`).join('');
 $('#as-send').disabled=AS.busy;
}
async function asSend(t){
 t=String(t||'').trim();if(!t||AS.busy)return;
 AS.msgs.push({role:'user',content:t});AS.busy=true;asRender();
 let r=null;
 if(ON_SITE){try{const res=await fetch(SB_URL+'/functions/v1/aer-asistente',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({messages:AS.msgs.slice(-8).map(x=>({role:x.role,content:x.content}))}),signal:AbortSignal.timeout?AbortSignal.timeout(30000):undefined});if(res.ok)r=await res.json()}catch(e){}}
 if(!r||!r.reply)r=asReglas(t);
 AS.msgs.push({role:'assistant',content:r.reply,servicio:r.servicio||null});AS.busy=false;asRender();
 const i=$('#as-in');if(i&&window.matchMedia('(min-width:561px)').matches)i.focus();
}
document.addEventListener('click',e=>{
 if(e.target.closest('#as-open')){AS.open=true;asRender();setTimeout(()=>{if(window.matchMedia('(min-width:561px)').matches)$('#as-in')?.focus()},50);return}
 if(e.target.closest('#as-x')){AS.open=false;asRender();return}
 const ch=e.target.closest('[data-as-chip]');if(ch){asSend(ch.dataset.asChip);return}
 const ci=e.target.closest('[data-as-cita]');if(ci){BK.serv=ci.dataset.asCita;renderServ();AS.open=false;asRender();document.getElementById('reservar').scrollIntoView({behavior:'smooth'});toast('Elige día y hora para tu cita');return}
});
document.addEventListener('submit',e=>{if(e.target.id==='as-f'){e.preventDefault();const i=$('#as-in');const v=i.value;i.value='';asSend(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&AS.open){AS.open=false;asRender()}});

/* ---- rutas ---- */
function route(){
 const h=location.hash.slice(1);if(ON_SITE&&!TALLER_PATH&&h==='taller'){location.replace('taller/');return}const inApp=TALLER_PATH||h==='taller';
 const was=!$('#app').hidden;
 $('#web').hidden=inApp;$('#app').hidden=!inApp;document.body.classList.toggle('in-app',inApp);
 if(inApp){AS.open=false;asRender();applyLang();renderApp();if(!was)window.scrollTo(0,0)}
 else{closeModal();if(was){renderDays();renderSlots();const el=h&&document.getElementById(h);setTimeout(()=>el?el.scrollIntoView():window.scrollTo(0,0),20)}}
}
window.addEventListener('hashchange',route);
bindWeb();route();initStore();
</script>
</body>
</html>
