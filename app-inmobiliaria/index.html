<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>App Inmobiliaria · Demo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1220">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Inmobiliaria">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: quiet canvas + hairline sidebar, dense but airy panels (Linear/Attio-like). Accent = agency colour. */
:root{
  --bg:#FAFAF9; --panel:#FFFFFF; --sub:#F4F4F2; --hover:#F0EFEC; --line:#E7E6E2; --line2:#EFEEEA;
  --fg:#18181B; --fg2:#52525B; --muted:#8B8B93; --accent:#2563EB; --on:#FFFFFF;
  --good:#15803D; --warn:#B45309; --bad:#B91C1C; --a1:#2563EB; --a2:#C2410C; --a3:#0F766E;
  --chat:#EEF0EC; --in:#FFFFFF; --out:#DCF3E2; --sh:0 1px 2px rgba(24,24,27,.04),0 4px 16px rgba(24,24,27,.04);
  --sh2:0 12px 40px rgba(24,24,27,.12),0 2px 6px rgba(24,24,27,.06);
  --f:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E10; --panel:#151517; --sub:#1B1B1E; --hover:#202024; --line:#27272B; --line2:#202024; --fg:#F4F4F5; --fg2:#B4B4BB; --muted:#7D7D86;
  --good:#4ADE80; --warn:#F59E0B; --bad:#F87171; --a1:#60A5FA; --a2:#FB923C; --a3:#2DD4BF; --chat:#111113; --in:#1F1F23; --out:#163A26;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh2:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E10; --panel:#151517; --sub:#1B1B1E; --hover:#202024; --line:#27272B; --line2:#202024; --fg:#F4F4F5; --fg2:#B4B4BB; --muted:#7D7D86;
  --good:#4ADE80; --warn:#F59E0B; --bad:#F87171; --a1:#60A5FA; --a2:#FB923C; --a3:#2DD4BF; --chat:#111113; --in:#1F1F23; --out:#163A26;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh2:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tint{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* app frame */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:1px;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border:0;background:transparent;text-align:left;border-radius:8px}
.ws:hover{background:var(--hover)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.ws b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ws small{display:block;color:var(--muted);font-size:11.5px}
.kbar{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;color:var(--muted);margin:0 0 10px;width:100%;text-align:left}
.kbar kbd{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--sub)}
.lbl{font-size:11px;font-weight:500;color:var(--muted);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:6px 10px;border-radius:7px;color:var(--fg2);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav[aria-current="page"]{background:var(--panel);color:var(--fg);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.nav svg{width:16px;height:16px;flex:none;opacity:.75}
.nav .ct{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.nav .ct.hot{color:var(--on);background:var(--accent);border-radius:999px;padding:0 6px}
.sfoot{margin-top:auto;padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px}
.sfoot b{color:var(--fg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.crumb{color:var(--muted);font-weight:500}.crumb b{color:var(--fg);font-weight:600}
.sp{flex:1}
.seg{display:flex;background:var(--sub);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-weight:500;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;font-weight:500;white-space:nowrap;box-shadow:var(--sh)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.pri:hover{opacity:.88;background:var(--fg)}
.btn.acc{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn svg{width:15px;height:15px}
.btn.sm{padding:4px 9px;font-size:12.5px}
.icb{position:relative;border:1px solid var(--line);background:var(--panel);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;box-shadow:var(--sh)}
.icb svg{width:16px;height:16px}
.icb .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.demo{font:500 11px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.main{padding:28px 24px 48px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0;max-width:1400px;width:100%;margin:0 auto;}
.main.anim{animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px}
.ph p{margin:4px 0 0;color:var(--fg2)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h3{font-size:13.5px;font-weight:600}
.ch small{color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:1.5fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font:600 26px var(--mono);letter-spacing:-.04em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--good);font-weight:500}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.kpi svg{width:90px;height:32px;flex:none}
.sim{font-size:11.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:9px 6px;border:0;border-top:1px solid var(--line2);background:transparent;text-align:left;width:100%;border-radius:0}
.li:first-child{border-top:0}
button.li:hover{background:var(--hover)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg2);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);background:var(--panel);white-space:nowrap}
.tag svg{width:11px;height:11px}
.sc{font:600 11.5px var(--mono);padding:1px 6px;border-radius:5px}
.sc.hi{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.sc.md{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.sc.lo{color:var(--muted);background:var(--sub)}
svg text{fill:var(--muted);font:500 10.5px var(--f)}
.funnel{display:flex;flex-direction:column;gap:9px}
.fr{display:grid;grid-template-columns:130px 1fr 54px;gap:12px;align-items:center;color:var(--fg2);font-weight:500}
.ftr{height:24px;background:var(--sub);border-radius:6px;overflow:hidden;position:relative}
.ffl{height:100%;background:var(--accent);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fpc{position:absolute;left:8px;top:3px;font:600 11.5px var(--mono);color:var(--on);mix-blend-mode:normal}
.fr .n{text-align:right;color:var(--fg);font-family:var(--mono)}
.feed .fi{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line2);align-items:start}
.feed .fi:first-child{border-top:0}
.feed .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--sub);color:var(--fg2)}
.feed .ic svg{width:13px;height:13px}
.feed .tm{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.newin{animation:newin .5s ease}
@keyframes newin{from{opacity:0;transform:translateY(-6px);background:color-mix(in srgb,var(--accent) 10%,transparent)}to{opacity:1;transform:none}}

/* filters */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;min-width:220px;box-shadow:var(--sh)}
.fb{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;font-weight:500;font-size:12.5px;color:var(--fg2)}
.fb[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vsep{width:1px;height:20px;background:var(--line);margin:0 2px}

/* board */
.bwrap{overflow-x:auto;padding-bottom:4px}
.board{display:grid;grid-template-columns:repeat(5,minmax(244px,1fr));gap:12px;min-width:1260px}
.col{background:var(--sub);border:1px solid var(--line2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:background .15s,border-color .15s}
.col.over{background:color-mix(in srgb,var(--accent) 7%,var(--sub));border-color:var(--accent)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 6px;font-weight:600}
.colh .num{color:var(--muted);font-weight:500}
.colh .addc{margin-left:auto;border:0;background:transparent;color:var(--muted);border-radius:6px;width:22px;height:22px;display:grid;place-items:center}
.colh .addc:hover{background:var(--hover);color:var(--fg)}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--sh);text-align:left;width:100%;transition:transform .12s,box-shadow .12s}
.pc:hover{box-shadow:var(--sh2)}
.pc.drag{opacity:.4}
.pc .r1{display:flex;align-items:center;gap:8px}
.pc .r3{display:flex;gap:5px;flex-wrap:wrap}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--sh)}}
.hint{font-size:12px;color:var(--muted)}

/* chat */
.chat{display:grid;grid-template-columns:290px 1fr 300px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);height:640px;box-shadow:var(--sh)}
.clist{border-right:1px solid var(--line);overflow-y:auto}
.citem{display:flex;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line2);background:transparent;width:100%;text-align:left;align-items:center}
.citem:hover{background:var(--hover)}
.citem[aria-current="true"]{background:var(--sub);box-shadow:inset 2px 0 0 var(--accent)}
.cmain{display:flex;flex-direction:column;min-width:0;background:var(--chat)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:7px}
.m{max-width:76%;padding:8px 11px;border-radius:10px;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.m.in{align-self:flex-start;background:var(--in);border-top-left-radius:3px}
.m.bot{align-self:flex-end;background:var(--out);border-top-right-radius:3px}
.m.team{align-self:flex-end;background:color-mix(in srgb,var(--accent) 16%,var(--in));border-top-right-radius:3px}
.m small{display:block;font:500 10px var(--mono);color:var(--muted);margin-top:2px;text-align:right}
.m .who{display:block;font-size:10.5px;font-weight:600;color:var(--a3);margin-bottom:1px}
.m.team .who{color:var(--accent)}
.sys{align-self:center;font-size:11.5px;font-weight:500;color:var(--fg2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.typing{align-self:flex-start;background:var(--in);border-radius:10px;padding:9px 12px;display:flex;gap:4px}
.typing.r{align-self:flex-end;background:var(--out)}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:dt 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-2px)}}
.compose{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
.compose input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sub)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg2);border:0;background:transparent}
.tog .sw{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.tog .sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog[aria-pressed="true"] .sw{background:var(--good)}
.tog[aria-pressed="true"] .sw:after{left:14px}
.fic{border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-weight:500}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:12.5px}
.chk i{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);font-size:10px;font-style:normal;font-weight:700}
.chk.no i{background:var(--sub);color:var(--muted)}

/* calls */
.cgrid{display:grid;grid-template-columns:1fr 1.15fr;gap:14px}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11.5px;font-weight:500;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line)}
.t td{padding:9px 8px;border-bottom:1px solid var(--line2)}
.t tr.sel td{background:var(--sub)}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--hover)}
.player{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.play{width:32px;height:32px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.play svg{width:14px;height:14px}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.wave i{flex:1;background:var(--line);border-radius:2px;transition:background .2s}
.wave i.on{background:var(--accent)}
.tx{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:360px;overflow-y:auto}
.tx p{margin:0;padding:7px 10px;border-radius:8px;background:var(--sub);font-size:13px}
.tx p b{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.tx p.vo{box-shadow:inset 2px 0 0 var(--accent)}
.tx p.live{animation:newin .4s ease}
.callnow{display:flex;align-items:center;gap:12px;border:1px solid color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 7%,var(--panel));border-radius:10px;padding:10px 12px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);animation:pu 1.2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

/* campaigns */
.ad{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ad .h{display:flex;align-items:center;gap:8px;padding:9px 10px}
.ad .im{height:128px;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 45%,#BBD3FF),color-mix(in srgb,var(--accent) 10%,#F2F6FF))}
.ad .im svg{position:absolute;inset:auto 0 0 0;width:100%}
.ad .f{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--sub);gap:8px;font-size:12.5px}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.ms div{background:var(--panel);padding:7px 9px}
.ms b{display:block;font:600 15px var(--mono)}
.ms span{font-size:11px;color:var(--muted)}
.range{width:100%;accent-color:var(--accent)}
.paused{opacity:.55}

/* agenda */
.awrap{overflow-x:auto}
.ag{display:grid;grid-template-columns:58px repeat(5,minmax(150px,1fr));min-width:860px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--sh)}
.ag .dh{padding:9px 10px;font-weight:600;border-bottom:1px solid var(--line);border-left:1px solid var(--line2);font-size:12.5px}
.ag .dh small{display:block;color:var(--muted);font-weight:400}
.ag .dh.today{color:var(--accent)}
.ag .hh{padding:6px 8px;font:500 11px var(--mono);color:var(--muted);border-bottom:1px solid var(--line2);height:64px}
.ag .cell{border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);height:64px;padding:3px;position:relative}
.ag .cell.empty:hover{background:var(--hover)}
.ag .cell.empty:hover:after{content:"+ Cita";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:500}
.ev{height:100%;width:100%;border:0;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:600;text-align:left;background:color-mix(in srgb,var(--c) 11%,var(--panel));box-shadow:inset 3px 0 0 var(--c);overflow:hidden;display:block}
.ev span{display:block;font-weight:400;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.55;text-decoration:line-through}

/* properties */
.house{height:136px;border-radius:9px;position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 45%,#BBD3FF),color-mix(in srgb,var(--accent) 10%,#F2F6FF))}
.house svg{position:absolute;inset:auto 0 0 0;width:100%}
.house .tg{position:absolute;left:8px;top:8px;background:rgba(15,15,18,.72);color:#fff;font-size:11px;font-weight:500;border-radius:6px;padding:2px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{background:var(--panel);padding:7px;text-align:center}
.stats b{display:block;font:600 17px var(--mono)}
.stats span{font-size:11px;color:var(--muted)}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* web */
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--sh)}
.browser .b{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--sub);border-bottom:1px solid var(--line)}
.browser .b i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.browser .url{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:500 12px var(--mono);color:var(--muted)}
.wh{background:#121316;color:#fff;padding:32px;display:grid;grid-template-columns:1.2fr .9fr;gap:24px;align-items:center}
.wh h2{font-size:30px;line-height:1.08;letter-spacing:-.03em}
.wh h2 em{font-style:normal;color:color-mix(in srgb,var(--accent) 55%,#fff)}
.wf{background:#fff;color:#111;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.wf input{border:1px solid #e5e5e5;border-radius:8px;padding:8px 10px;font-size:13px;color:#111;background:#fff}
.wf button{border:0;background:var(--accent);color:var(--on);border-radius:8px;padding:9px;font-weight:600}

/* tasks */
.task{display:flex;align-items:center;gap:10px;padding:8px 4px;border:0;border-top:1px solid var(--line2);background:transparent;width:100%;text-align:left}
.task:first-child{border-top:0}
.box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:10px;font-weight:700;color:var(--bg)}
.task.done .box{background:var(--fg);border-color:var(--fg)}
.task.done .t1{text-decoration:line-through;color:var(--muted)}

/* owner */
.owner{padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;gap:56px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:380px;max-width:100%;height:780px;background:var(--panel);border:9px solid #0d0d0f;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25),0 0 0 1px #2a2a2e}
.pst{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:600 12px var(--mono);flex:none}
.pb{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.pb>*{flex:none}
.ptabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);flex:none;padding-bottom:12px;background:var(--panel)}
.ptabs button{border:0;background:transparent;padding:9px 0 3px;font-size:10.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.ptabs button[aria-current="true"]{color:var(--fg)}
.ptabs svg{width:19px;height:19px}
.ptabs .bdg{position:absolute;top:5px;left:57%;background:#E5484D;color:#fff;font:600 9.5px var(--mono);border-radius:999px;padding:0 4px}
.track .tk{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:12px}
.track .tk:before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.track .tk:last-child:before{display:none}
.track .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--on);position:relative;z-index:1}
.track .done .d{background:var(--accent);border-color:var(--accent)}
.track .now .d{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.track b{display:block;font-weight:500;font-size:13px}.track span{font-size:11.5px;color:var(--muted)}
.ni{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.ni:first-child{border-top:0}
.ni .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.ni .ic svg{width:16px;height:16px}
.ni b{font-weight:600;display:block}
.ni p{margin:0;color:var(--fg2);font-size:12.5px}
.ni .tm{font:500 10.5px var(--mono);color:var(--muted)}
.offer{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.offer .amt{font:600 22px var(--mono);letter-spacing:-.04em}
.offer .acts{display:flex;gap:6px}
.stars button{border:0;background:transparent;padding:0 1px;font-size:16px;color:var(--line)}
.stars button.on{color:#F5A524}
.explain{max-width:420px;display:flex;flex-direction:column;gap:16px;padding-top:24px}
.explain h2{font-size:28px;letter-spacing:-.03em}
.explain p{margin:0;color:var(--fg2)}
.exi{display:flex;gap:12px}
.exi .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.exi .ic svg{width:16px;height:16px}
.exi b{display:block;font-weight:600}.exi span{color:var(--fg2);font-size:13px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.35);backdrop-filter:blur(2px);z-index:40;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--panel);z-index:41;box-shadow:var(--sh2);display:flex;flex-direction:column;border-left:1px solid var(--line);animation:slide .22s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}

.noanim{animation:none!important}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dtabs{display:flex;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line)}
.dtabs button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-weight:500;color:var(--muted)}
.dtabs button[aria-pressed="true"]{background:var(--sub);color:var(--fg)}
.db{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.df{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.x{border:0;background:transparent;width:30px;height:30px;border-radius:7px;font-size:18px;margin-left:auto;color:var(--muted)}
.x:hover{background:var(--hover);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel)}
.field textarea{min-height:64px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(480px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:41;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh2);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.97)}}
.modal h2{font-size:17px}
.mfoot{display:flex;gap:8px;justify-content:flex-end}
.swc{display:flex;gap:8px}
.swc button{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel)}
.swc button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:41;box-shadow:var(--sh2);overflow:hidden;animation:pop .15s ease}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;background:transparent}
.cmdk input:focus{outline:none}
.cmdk .res{max-height:340px;overflow-y:auto;padding:6px}
.cmdk .res button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left}
.cmdk .res button:hover,.cmdk .res button.on{background:var(--sub)}
.cmdk .grp{font-size:11px;color:var(--muted);padding:8px 10px 2px}
.notif{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:58px;width:min(360px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);z-index:41;padding:10px 14px;animation:pop2 .15s ease}
@keyframes pop2{from{opacity:0;transform:translateY(-4px)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--sh2);max-width:calc(100% - 32px);display:flex;gap:9px;align-items:center;animation:pop2 .2s ease}
.toast i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}

/* assistant */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:8px;border:0;background:var(--fg);color:var(--bg);padding:10px 16px 10px 12px;border-radius:999px;font-weight:600;box-shadow:var(--sh2)}
.fab svg{width:16px;height:16px}
.aip{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:36;width:min(400px,calc(100% - 32px));height:min(600px,calc(100vh - 100px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);display:flex;flex-direction:column;overflow:hidden;animation:pop2 .18s ease}
.aih{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.aih .orb{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#a78bfa));display:grid;place-items:center;color:#fff}
.aih .orb svg{width:16px;height:16px}
.ail{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.am{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px;white-space:pre-line}
.am.u{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:4px}
.am.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.am.a b{font-weight:600}
.am .lk{display:inline-flex;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;background:var(--sub);cursor:pointer}
.aic{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.aic button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--fg2)}
.aic button:hover{background:var(--hover);color:var(--fg)}
.aif{display:flex;gap:8px;padding:10px 12px 12px}
.aif input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--sub)}
.oai{display:flex;flex-direction:column;gap:8px;flex:1}
.oai .ail{background:var(--chat);border-radius:12px;padding:10px;min-height:300px}
.oask{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sub);text-align:left;width:100%}
.oask svg{width:16px;height:16px;color:var(--accent)}

@media (max-width:1200px){.chat{grid-template-columns:250px 1fr}.fic{display:none}.g2,.cgrid,.g2e{grid-template-columns:1fr}.wh{grid-template-columns:1fr}}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px))}
  .side .lbl,.sfoot,.kbar{display:none}
  .ws{padding:4px 8px}.ws small{display:none}
  .nav{white-space:nowrap;width:auto;flex:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}

  .clist{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}

  .ms{grid-template-columns:repeat(2,1fr)}
  .explain{padding-top:0}
  .frow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--navy:#0B1220;--navy2:#111A2E;--navy3:#1A2540;--navfg:#AEB8CC;--glow:color-mix(in srgb,var(--accent) 35%,transparent);

.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lbrand{position:relative;overflow:hidden;background:radial-gradient(700px 400px at 80% 10%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%),linear-gradient(160deg,#0B1220,#16213B);color:#fff;padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:24px}

.lbrand .art{border-radius:20px;overflow:hidden;max-width:560px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.lbrand .art svg{display:block;width:100%;height:auto}
.lform{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px max(32px,env(safe-area-inset-right,0px)) 48px 48px;max-width:460px}
.lform h2{font-size:24px}

.lopt:hover{border-color:var(--accent);transform:translateY(-1px)}
.lopt .ic2{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);flex:none}
.lopt .ic2 svg{width:20px;height:20px}
.lopt b{display:block;font-weight:600}.lopt .t2{white-space:normal}
/* tour */
.tourmask{position:fixed;z-index:70;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,12,22,.6);pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tourtip{position:fixed;z-index:71;width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh2);transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tourtip .n{font:600 11px var(--mono);color:var(--accent)}

.tourtip p{margin:0;color:var(--fg2)}
.tourtip .ta{display:flex;gap:8px;margin-top:14px;align-items:center}
.btn.pres{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
@media (max-width:1200px){.hero-dash{grid-template-columns:1fr}}
@media (max-width:880px){.login{grid-template-columns:1fr}.lbrand{padding:32px 16px}.lform{padding:32px 16px;max-width:none}.lbrand h1{font-size:30px}.side{background:var(--navy)}}

 S.sim={id,full,shown:[],typing:null,run:true};S.view='equipo';S.tab='conversaciones';S.conv=id;close();render();push(['mega','Campañas',`${p.n} hizo clic en el anuncio`,hm]);toast('Nuevo propietario escribiendo por WhatsApp');

 <div class="ch" style="margin:0"><h3>Visitas</h3></div>${v.visits.map(x=>`<div class="li"><span class="ic tint" style="width:26px;height:26px;border-radius:7px;display:grid;place-items:center">${ic('eye','width="14" height="14"')}</span><div class="grow"><div class="t1">${esc(x.who)}</div><div class="t2" style="white-space:normal">${esc(x.c)}</div></div><span class="mono t2">${'★'.repeat(x.r)}</span></div>`).join('')}
 <div class="ch" style="margin:6px 0 0"><h3>Ofertas</h3></div>${v.offers.length?v.offers.map(o=>`<div class="li"><b class="mono">${o.amt}</b><span class="t2 grow">${esc(o.d)}</span><span class="st"><i style="background:${o.s==='acc'?'var(--good)':o.s==='pend'?'var(--warn)':'var(--muted)'}"></i>${o.s==='acc'?'Aceptada':o.s==='pend'?'Pendiente':o.s==='cnt'?'Contraoferta':'Rechazada'}</span></div>`).join(''):'<p class="t2">Sin ofertas todavía.</p>'}</div>
 <div class="df"><button class="btn sm" data-act="addvisit" data-v="${k}">${ic('eye')}Registrar visita</button><button class="btn sm" data-act="addoffer" data-v="${k}">${ic('offer')}Registrar oferta</button><span class="sp"></span><button class="btn sm pri" data-act="asowner" data-v="${k}">App de ${v.owner} →</button></div></div>`)}
const _owner=owner0;
function owner(){let h=_owner();const v=V[S.vv],i=Object.keys(V).indexOf(S.vv);
 h=h.replace(/<div class="house"><span class="tg">En venta · exclusiva<\/span>[\s\S]*?<\/svg><\/div>/,`<div class="ohero">${iso(i+3,KIND(v.t),480,330)}<div class="ov"><b>${v.t}</b><span>${v.pr} · ${VSTEPS[v.step]}</span></div></div>`);
 const pend=v.offers.find(o=>o.s==='pend');if(pend&&S.otab==='inicio')h=h.replace('<div class="pb">',`<div class="push"><span class="logo">${esc(initials(S.agency))}</span><div class="grow"><b style="font-size:13px">Nueva oferta · ${pend.amt}</b><div class="t2">${esc(pend.d)}</div></div><button class="btn sm acc" data-act="otab" data-t="ofertas">Ver</button></div><div class="pb">`);
 return h}
const _top=top0;
function top(){return _top().replace('<span class="demo">DEMO</span>',`<button class="btn sm pres" data-act="tour">${ic('play')}Modo presentación</button><button class="btn sm ghost" data-act="logout">Salir</button>`)}
const _side=side0;
function side(){return _side().replace('</nav>','<div class="pwr">'+ic('spark','width="12" height="12"')+'Tecnología Galerna Method</div></nav>')}
function login(){return `<div class="login"><div class="lbrand"><div style="display:flex;align-items:center;gap:10px"><span class="logo" style="width:34px;height:34px">${esc(initials(S.agency))}</span><b style="font-size:16px">${esc(S.agency)}</b></div>
 <div><h1>Cada venta,<br>paso a paso.</h1><p style="margin-top:14px">El espacio de ${esc(S.agency)} para su equipo y para los propietarios que venden con ellos: visitas, ofertas y papeles, siempre al día.</p></div>
 <div class="art">${iso(5,'casa',560,300,false)}</div><div class="t2" style="color:#7C879D">Demo · datos simulados · Tecnología Galerna Method</div></div>
 <div class="lform"><h2>Bienvenido</h2><p class="t2" style="white-space:normal;margin:0">Elige cómo quieres entrar en la demo.</p>
 <button class="lopt" data-act="enter" data-v="equipo"><span class="ic2">${ic('team')}</span><span class="grow"><b>Equipo de la inmobiliaria</b><span class="t2">Propietarios, agenda, agente de voz, campañas y métricas</span></span>→</button>
 <button class="lopt" data-act="enter" data-v="propietario"><span class="ic2">${ic('house')}</span><span class="grow"><b>Propietario</b><span class="t2">Su vivienda, visitas, ofertas y asistente</span></span>→</button>
 <button class="lopt" data-act="enter" data-v="tour"><span class="ic2">${ic('play')}</span><span class="grow"><b>Recorrido guiado</b><span class="t2">Te enseño todo en 9 pasos</span></span>→</button>
 <button class="btn ghost sm" data-act="custom" style="align-self:flex-start">Personalizar nombre, zona y color</button></div></div>`}
const TOUR=[['equipo','inicio','.hero-dash','Todo de un vistazo','Honorarios en cartera, citas del día y propietarios nuevos en cuanto abrís la app.'],['equipo','inicio','#zonemap','Vuestra zona, en exclusiva','Cada punto es un propietario. Nadie más en vuestra zona tiene este sistema.'],['equipo','propietarios','.board','Cada propietario en su fase','Arrastrad las tarjetas. El número es su interés real de venta.'],['equipo','conversaciones','.chat','El asistente filtra 24/7','Contesta en segundos, hace las preguntas y propone cita. Podéis entrar cuando queráis.'],['equipo','llamadas','.cgrid','El agente de voz llama al minuto','Cada llamada, grabada y transcrita.'],['equipo','agenda','.ag','Citas que entran solas','Con confirmación y recordatorio por WhatsApp.'],['equipo','viviendas','.main .grid','Vuestra cartera','Visitas y ofertas que le llegan al propietario al momento.'],['propietario',null,'.phone','La app del propietario','Su venta paso a paso, ofertas y su propio asistente.'],['equipo','inicio','.fab','Pregunta lo que quieras','El asistente conoce todos vuestros datos.']];
function tourShow(){const st=TOUR[S.tour];if(!st){S.tour=null;$('#tourbox').innerHTML='';return}
 S.view=st[0];if(st[1])S.tab=st[1];S.anim=false;render();setTimeout(()=>{const el=document.querySelector(st[2]);const tb=$('#tourbox');if(!el){tb.innerHTML='';return}el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>{const r=el.getBoundingClientRect(),pad=8;const tw=Math.min(340,innerWidth-32);let left=Math.min(Math.max(16,r.left),innerWidth-tw-16),topp=r.bottom+14;if(topp+190>innerHeight)topp=Math.max(16,r.top-200);
  tb.innerHTML=`<div class="tourmask" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div><div class="tourtip" role="dialog" aria-label="Recorrido" style="left:${left}px;top:${topp}px"><div class="n">PASO ${S.tour+1} DE ${TOUR.length}</div><h3>${st[3]}</h3><p>${st[4]}</p><div class="ta"><button class="btn sm ghost" data-act="tourend">Salir</button><span class="sp"></span>${S.tour?'<button class="btn sm" data-act="tourprev">Atrás</button>':''}<button class="btn sm pri" data-act="tournext">${S.tour===TOUR.length-1?'Terminar':'Siguiente'}</button></div></div>`},350)},60)}
S.login=true;
const _render=render0;
function render(){if(S.login){document.documentElement.style.setProperty('--accent',S.accent);$('#app').innerHTML=login();return}_render();if(S.tour==null){const tb=$('#tourbox');if(tb)tb.innerHTML=''}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='enter'){S.login=false;if(b.dataset.v==='tour'){S.tour=0;tourShow()}else{S.view=b.dataset.v;S.anim=true;render()}}
 else if(a==='logout'){S.login=true;S.tour=null;render()}
 else if(a==='tour'){S.tour=0;tourShow()}
 else if(a==='tournext'){S.tour++;if(S.tour>=TOUR.length){S.tour=null;$('#tourbox').innerHTML='';toast('Fin del recorrido');render()}else tourShow()}
 else if(a==='tourprev'){S.tour=Math.max(0,S.tour-1);tourShow()}
 else if(a==='tourend'){S.tour=null;$('#tourbox').innerHTML=''}
 else if(a==='prop')propDrawer(b.dataset.v);
 else if(a==='asowner'&&document.querySelector('.drawer'))close();
});
window.addEventListener('resize',()=>{if(S.tour!=null)tourShow()});

render();
})();
</script>
