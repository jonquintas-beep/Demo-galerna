<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gorobel · Jiu-jitsu, Boxeo y Kickboxing</title>
<meta name="description" content="Reserva tus clases, descubre tu deporte de contacto y entrena la sombra con un coach que te canta los combos.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0D0A">
<meta property="og:title" content="Gorobel">
<meta property="og:description" content="Jiu-jitsu, boxeo y kickboxing. Tu app de socio.">
<meta property="og:image" content="https://app.galernamethod.com/gorobel/icons/icon-512.png">
<meta property="og:url" content="https://app.galernamethod.com/gorobel/">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gorobel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap">
<style>
:root{
  --bg:#0C0D0A;--bg2:#12140E;--card:#191C13;--card2:#222619;--line:rgba(237,234,224,.10);--line2:rgba(237,234,224,.18);
  --bone:#EDEAE0;--sub:#A5A996;--faint:#6E7262;--sage:#93A06A;--sage-b:#BCCB86;--sage-d:#5E6844;
  --box:#E8483B;--kb:#F3A73F;--bjj:#ECE7D6;--ok:#8FD16A;--bad:#FF6B5E;
  --disp:"Anton","Impact","Haettenschweiler",sans-serif;--ui:"Montserrat","Segoe UI",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#070806}
body{background:#070806;color:var(--bone);font-family:var(--ui);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);overflow:hidden}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6)}}
.view{padding:0 18px calc(104px + var(--safe-b));min-height:100dvh}
.view.nonav{padding-bottom:calc(30px + var(--safe-b))}
.num{font-family:var(--disp);letter-spacing:.01em;font-weight:400}
.k{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}
.h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:44px;line-height:.92;letter-spacing:.005em}
.h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:26px;line-height:1;letter-spacing:.01em}
.sub{color:var(--sub)}
.row{display:flex;align-items:center;gap:10px}
.sec{margin-top:26px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sech a,.lnk{font-size:13px;font-weight:700;color:var(--sage-b);background:none;border:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;border:0;font-weight:800;font-size:15px;letter-spacing:.02em}
.btn.pri{background:var(--sage-b);color:#11140A}
.btn.hot{background:var(--box);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--bone)}
.btn.full{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:rgba(237,234,224,.08);color:var(--bone)}
.sp-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 0 6px}
.top img{height:17px;display:block}
.av{width:38px;height:38px;border-radius:50%;background:var(--sage-d);display:grid;place-items:center;font-weight:900;font-size:14px;border:2px solid var(--sage);color:var(--bone)}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + var(--safe-b));background:linear-gradient(180deg,rgba(12,13,10,0),rgba(12,13,10,.92) 26%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;color:var(--faint);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--bone)}
.nav button.on svg{color:var(--sage-b)}
.nav .mid{position:relative}
.nav .mid span.o{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:var(--box);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(232,72,59,.45);border:4px solid var(--bg)}
.nav .mid.on span.o{background:var(--sage-b);color:#11140A}
.nav .mid.on svg{color:#11140A}
.nav .mid svg{color:#fff}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:var(--bone);color:#11140A;font-weight:800;font-size:14px;padding:12px 18px;border-radius:14px;max-width:92%;text-align:center;transition:.25s;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* splash */
.sp{position:relative;min-height:100dvh;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top,0px)) 22px calc(26px + var(--safe-b));overflow:hidden}
.sp-bg{position:absolute;inset:0;pointer-events:none}
.sp-word{position:absolute;left:-8px;right:-8px;font-family:var(--disp);text-transform:uppercase;font-size:136px;line-height:.82;color:transparent;-webkit-text-stroke:1.2px rgba(147,160,106,.22);white-space:nowrap;letter-spacing:-.01em}
.sp-top img{height:22px}
.sp-hero{margin-top:auto;position:relative}
.sp-hero .h1{font-size:64px}
.sp-hero .h1 em{font-style:normal;color:var(--sage-b)}
.sp-hero p{margin-top:12px;color:#CFCDBF;font-size:16px;max-width:30ch}
.sp-sports{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.sp-opts{display:grid;gap:10px;margin-top:26px;position:relative}
.opt-big{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:20px;border:1.5px solid var(--line2);background:rgba(25,28,19,.82);backdrop-filter:blur(6px)}
.opt-big.pri{background:var(--sage-b);color:#11140A;border-color:transparent}
.opt-big .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.12)}
.opt-big:not(.pri) .ic{background:rgba(237,234,224,.08);color:var(--sage-b)}
.opt-big b{display:block;font-size:17px;font-weight:900}
.opt-big small{font-size:13px;font-weight:600;opacity:.8}
.opt-big i{font-style:normal;font-weight:900;font-size:20px}
.sp-foot{margin-top:18px;text-align:center;font-size:11.5px;color:var(--faint);position:relative}
/* quiz */
.qz{min-height:100dvh;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(22px + var(--safe-b))}
.qz-top{display:flex;align-items:center;gap:12px}
.qz-x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(237,234,224,.08);font-size:15px}
.qz-bar{flex:1;height:6px;border-radius:9px;background:rgba(237,234,224,.1);overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--sage-b);border-radius:9px;transition:width .35s}
.qz-coach{display:flex;gap:10px;align-items:flex-start;margin-top:26px}
.qz-coach .cav{flex:none;width:42px;height:42px;border-radius:50%;background:var(--sage);display:grid;place-items:center;color:#11140A}
.qz-coach .bub{background:var(--card2);border-radius:4px 18px 18px 18px;padding:12px 14px;font-weight:600;font-size:15px}
.qz h2{margin-top:22px;font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:38px;line-height:.95}
.qz-opts{display:grid;gap:10px;margin-top:20px}
.qz-opt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:18px;border:1.5px solid var(--line2);background:var(--card);transition:transform .12s,border-color .12s,background .12s}
.qz-opt:active{transform:scale(.98)}
.qz-opt.on{border-color:var(--sage-b);background:color-mix(in srgb,var(--sage-b) 14%,var(--card))}
.qz-opt .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(237,234,224,.07);color:var(--sage-b)}
.qz-opt .ic svg{width:26px;height:26px}
.qz-opt b{display:block;font-size:16px;font-weight:800}
.qz-opt small{font-size:13px;color:var(--sub);font-weight:600}
.qz-foot{margin-top:auto;padding-top:18px}
/* result */
.rs-hero{position:relative;margin:0 -18px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 26px;background:radial-gradient(420px 260px at 85% 10%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),linear-gradient(180deg,#151810,var(--bg));overflow:hidden}
.rs-hero .big{font-family:var(--disp);text-transform:uppercase;font-size:76px;line-height:.86;color:var(--c);margin-top:8px}
.rs-match{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.rs-match b{font-family:var(--disp);font-size:44px;font-weight:400}
.rs-ill{position:absolute;right:-14px;bottom:-10px;width:170px;height:170px;opacity:.95;color:var(--c)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-r{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-weight:800;font-size:14px}
.bar-r .tr{height:14px;border-radius:9px;background:rgba(237,234,224,.08);overflow:hidden}
.bar-r .tr i{display:block;height:100%;border-radius:9px;background:var(--c);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar-r .pc{text-align:right;font-family:var(--disp);font-size:20px;font-weight:400}
.why{display:flex;flex-direction:column;gap:10px}
.why div{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14.5px}
.why div span{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);display:grid;place-items:center;font-weight:900;font-size:14px}
.gymx{position:relative;overflow:hidden;border:0;background:linear-gradient(135deg,#2A1512,#1A1D14 70%);padding:18px}
.gymx::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(232,72,59,.16)}
.gymx .h2{color:#FF8B7F}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.week div{border-radius:10px;padding:8px 2px;text-align:center;background:rgba(237,234,224,.05);font-size:10.5px;font-weight:800;color:var(--sub)}
.week div b{display:block;font-size:13px;color:var(--bone);margin-bottom:4px}
.week div i{display:block;height:6px;border-radius:9px;margin:4px 6px 0;background:var(--c,transparent)}
/* home */
.hello{margin-top:14px}
.hello .h1{font-size:50px}
.hello .h1 span{color:var(--sage-b)}
.next{position:relative;overflow:hidden;margin-top:18px;border-radius:24px;padding:18px;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 92%,#000) 0%,color-mix(in srgb,var(--c) 55%,#000) 100%);color:#11140A}
.next.bjj{color:#11140A}
.next .stripes{position:absolute;inset:0;background:repeating-linear-gradient(-55deg,rgba(0,0,0,.07) 0 14px,transparent 14px 30px);pointer-events:none}
.next .k{color:rgba(17,20,10,.7)}
.next .ttl{font-family:var(--disp);text-transform:uppercase;font-size:40px;line-height:.92;margin-top:6px;position:relative}
.next .meta{display:flex;gap:14px;margin-top:10px;font-weight:800;font-size:13.5px;position:relative;flex-wrap:wrap}
.next .cd{display:flex;gap:6px;margin-top:14px;position:relative}
.next .cd div{background:rgba(17,20,10,.82);color:var(--bone);border-radius:12px;padding:6px 10px;text-align:center;min-width:58px}
.next .cd b{display:block;font-family:var(--disp);font-size:28px;font-weight:400;line-height:1}
.next .cd small{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.next .acts{display:flex;gap:8px;margin-top:14px;position:relative}
.next .acts .btn{background:#11140A;color:var(--bone);height:44px}
.next .acts .btn.ghost{background:rgba(17,20,10,.12);border-color:rgba(17,20,10,.3);color:#11140A}
.next-ill{position:absolute;right:-18px;top:-6px;width:150px;height:150px;color:rgba(17,20,10,.16)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats3 .card{padding:12px;border-radius:16px}
.stats3 b{display:block;font-family:var(--disp);font-size:32px;font-weight:400;line-height:1}
.stats3 small{font-size:11.5px;color:var(--sub);font-weight:700}
.stats3 .fire b{color:var(--kb)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;text-align:left;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:14px;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end}
.tile .ic{position:absolute;top:12px;left:14px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:16px;font-weight:900;line-height:1.15}
.tile small{font-size:12.5px;color:var(--sub);font-weight:600}
.tile.wide{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.tile.wide .ic{position:static}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.mini{flex:none;width:168px;text-align:left;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:12px;position:relative;overflow:hidden}
.mini::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.mini .t{font-family:var(--disp);font-size:26px;line-height:1}
.mini b{display:block;font-size:14px;margin-top:4px;line-height:1.2}
.mini small{font-size:12px;color:var(--sub);font-weight:600}
.mini .pl{margin-top:8px;height:5px;border-radius:9px;background:rgba(237,234,224,.08);overflow:hidden}
.mini .pl i{display:block;height:100%;background:var(--c)}
.combo{position:relative;overflow:hidden;border:0;background:#13160E;padding:18px;border-radius:22px;border:1px solid var(--line)}
.combo .seq{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.combo .seq span{font-family:var(--disp);font-size:24px;padding:4px 12px;border-radius:12px;background:rgba(237,234,224,.08)}
.combo .seq span.kick{background:color-mix(in srgb,var(--kb) 25%,transparent);color:var(--kb)}
.combo .w{font-size:13px;color:var(--sub);font-weight:700;margin-top:8px}
.lb{display:flex;flex-direction:column}
.lb div{display:grid;grid-template-columns:26px 34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.lb div:last-child{border-bottom:0}
.lb .p{font-family:var(--disp);font-size:18px;color:var(--sub);text-align:center}
.lb .a{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:900}
.lb .me{color:var(--sage-b)}
.lb .me .a{background:var(--sage-b);color:#11140A}
.lb .v{font-family:var(--disp);font-size:20px}
.lb-bar{height:8px;border-radius:9px;background:rgba(237,234,224,.08);overflow:hidden;margin:10px 0 4px}
.lb-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--box),var(--kb))}
/* classes */
.days{display:flex;gap:6px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.days button small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.days button b{font-family:var(--disp);font-size:24px;font-weight:400;line-height:1}
.days button i{width:5px;height:5px;border-radius:50%;background:transparent}
.days button.has i{background:var(--sage-b)}
.days button.on{background:var(--bone);color:#11140A;border-color:var(--bone)}
.days button.on small{color:#55594A}
.filt{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line2);background:transparent;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.filt button.on{background:var(--c,var(--bone));border-color:var(--c,var(--bone));color:#11140A}
.filt button.on .sp-dot{background:#11140A}
.cls{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cl{position:relative;display:grid;grid-template-columns:68px 1fr;gap:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);padding:14px;overflow:hidden}
.cl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cl.mine{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--card))}
.cl .tm{font-family:var(--disp);font-size:28px;line-height:1}
.cl .tm small{display:block;font-family:var(--ui);font-size:11px;font-weight:700;color:var(--sub);margin-top:4px}
.cl h3{font-size:17px;font-weight:900;line-height:1.15}
.cl .m{font-size:12.5px;color:var(--sub);font-weight:600;margin-top:2px}
.cl .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.spots{flex:1}
.spots .tr{height:6px;border-radius:9px;background:rgba(237,234,224,.08);overflow:hidden}
.spots .tr i{display:block;height:100%;background:var(--c)}
.spots small{display:block;font-size:11.5px;font-weight:800;margin-top:4px;color:var(--sub)}
.spots small.low{color:var(--kb)}
.spots small.full{color:var(--bad)}
.cl .bk{height:40px;padding:0 16px;border-radius:12px;border:0;font-weight:900;font-size:13.5px;background:var(--bone);color:#11140A;white-space:nowrap}
.cl .bk.wait{background:transparent;border:1.5px solid var(--line2);color:var(--bone)}
.cl .bk.done{background:var(--c);color:#11140A}
.cl .tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sage-b);color:#11140A;vertical-align:2px}
.empty{text-align:center;padding:40px 10px;color:var(--sub)}
/* sombra */
.sh-hero{text-align:center;margin-top:8px}
.ring{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:12px auto 0}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.ring .ph{font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--pc)}
.ring .clock{font-family:var(--disp);font-size:84px;line-height:.95}
.ring .rd{font-weight:800;font-size:13px;color:var(--sub)}
.call{min-height:118px;margin-top:10px;text-align:center}
.call .seq{font-family:var(--disp);font-size:52px;line-height:1;text-transform:uppercase;letter-spacing:.01em;transition:transform .15s}
.call .seq.pop{animation:pop .35s ease}
.call .w{font-size:14px;font-weight:800;color:var(--sub);margin-top:6px;text-transform:uppercase;letter-spacing:.08em}

    if (d.qz === 'back') { if (UI.q) { UI.q--; render(); } else go(S.mode ? 'home' : 'splash'); return; }

    if (d.trial) { if (!S.trial) { S.trial = d.trial; S.book[d.trial] = 'ok'; save(); render(); punch('¡Reservada!', 'var(--sage-b)'); toast('Clase de prueba reservada. Te llega el recordatorio por WhatsApp'); } else go('home'); return; }
    if (d.cancel || d.unbook) { delete S.book[d.cancel || d.unbook]; if (S.trial === (d.cancel || d.unbook)) S.trial = null; save(); render(); toast('Reserva cancelada. Tu plaza pasa a la lista de espera'); return; }
    if (d.book) { S.book[d.book] = 'ok'; save(); render(); var c = classesOn(UI.day).filter(function (x) { return x.id === d.book; })[0]; punch('¡Dentro!', c ? SP[c.sp].c : null); toast('Reservada. Te avisamos 2 horas antes'); return; }
    if (d.wait) { S.book[d.wait] = 'wait'; save(); render(); toast('Estás en lista de espera. Si se libera plaza, es tuya'); return; }
    if (d.day) { UI.day = +d.day; render(); return; }
    if (d.openday) { UI.day = +d.openday; go('clases'); return; }
    if (d.filt) { UI.filt = d.filt; render(); return; }
    if (d.gym) { S.gym = true; save(); UI.q = 0; UI.qa = { from: 'gym' }; ask('Vengo del gimnasio'); go('coach'); return; }
    if (d.shc) { var p = d.shc.split('|'); UI.sh[p[0]] = p[0] === 'sp' ? p[1] : +p[1]; if (p[0] === 'voice') UI.sh.voice = !!+p[1]; render(); return; }
    if (d.shs) { UI.sh.speed = d.shs; S.vspeed = d.shs; save(); render(); sayTok([{ k: '1', t: '¡Jab!' }, { k: '2', t: '¡Cross!' }, { k: '3', t: '¡Gancho!' }], true); return; }
    if (d.vtest) { sayTok([{ k: '1', t: '¡Jab!' }, { k: '2', t: '¡Cross!' }, { k: '3', t: '¡Gancho!' }, 'vamos'], true); return; }
    if (d.vrec) { vRecSheet(); return; }
    if (d.shpreset) { UI.sh.sp = d.shpreset; UI.sh.rounds = 3; UI.sh.dur = 120; go('sombra'); return; }
    if (d.shstart) { bell(1); shStart(); return; }
    if (d.shpause) { SH.paused = !SH.paused; if (SH.paused) vStop(); render(); return; }
    if (d.shstop) { shFinish(false); return; }
    if (d.ptab) { UI.ptab = d.ptab; render(); return; }
    if (d.tech) { var t = d.tech.split('|'), L = S.tech[t[0]] = S.tech[t[0]] || [], i = +t[1], k = L.indexOf(i); if (k >= 0) L.splice(k, 1); else { L.push(i); punch('¡Técnica!', SP[t[0]].c); } save(); render(); return; }
    if (d.ask) { ask(d.ask); return; }
    if (d.act) {
      var a = d.act;
      if (a === 'quiz') { UI.q = 0; UI.qa = {}; go('quiz'); }
      else if (a === 'quizgym') { UI.q = 1; UI.qa = { from: 'gym' }; go('quiz'); }
      else if (a === 'clases') go('clases');
      else if (a === 'trial') { var tc = nextClasses(0, 7).filter(function (c) { return /Iniciaci|Fundamentos|Fit/.test(c.lvl + c.n); })[0]; if (tc) { S.trial = tc.id; S.book[tc.id] = 'ok'; save(); go('home'); punch('¡Reservada!'); toast('Clase de prueba: ' + tc.n + ' · ' + dayLabel(tc) + ' ' + tc.t); } }
      else if (a === 'wa') toast('En la app real se abre el WhatsApp de Gorobel');
    }
  });
  document.addEventListener('change', function (e) { if (e.target.id === 'vSel') { S.vname = e.target.value; save(); sayTok([{ k: '_', t: '¡Jab! ¡Cross! ¡Gancho!' }, 'vamos'].map(function (x, i) { return i ? x : { k: '_', t: '¡Jab! ¡Cross! ¡Gancho!' }; }), true); } });
  document.addEventListener('submit', function (e) { if (e.target.id === 'askF') { e.preventDefault(); var i = $('askI'); ask(i.value); } });

  S = load(); if (!S) { S = seed(); save(); } else if (S.mode) UI.r = 'home';
  if (S.vspeed) UI.sh.speed = S.vspeed;
  if (window.speechSynthesis) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function () { if (UI.r === 'sombra' && SH.ph === 'idle') render(); }; } catch (e) {}
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
