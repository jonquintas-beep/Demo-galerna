<title>Bodychronos · App</title>
<meta name="description" content="Tu entrenamiento personal, tus mediciones y tus ejercicios para casa, con el método de Bodychronos.">

<style>
:root{--p:#7A1961;--p-d:#4E0F3E;--p-l:#F5E8F1;--p-m:#B04A95;--g:#414041;--sub:#6B6870;--line:#E7E1E5;--bg:#FAF8F9;--card:#fff;--ok:#2E8B57;--ok-l:#E4F4EA;--warn:#C27C0E;--warn-l:#FBF1DE;--bad:#C0392B}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:"Nunito Sans",system-ui,sans-serif;background:var(--bg);color:var(--g);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sw{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:#fff;border-bottom:1px solid var(--line)}
.sw img{height:30px}
.seg{display:flex;background:var(--p-l);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:800;font-size:13.5px;color:var(--p-d)}
.seg button.on{background:var(--p);color:#fff}
/* ---------- app cliente ---------- */
.c{max-width:520px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom,0px))}
.hello{margin-top:18px}
.hello small{font-size:15px;color:var(--sub);font-weight:700}
.hello h1{font-size:34px;font-weight:900;color:var(--p-d);line-height:1.1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.big-card{background:linear-gradient(150deg,var(--p),var(--p-d));color:#fff;border:0;position:relative;overflow:hidden}
.big-card .ring{position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;border:2px dashed rgba(255,255,255,.28)}
.big-card small{font-size:14px;font-weight:700;opacity:.85}
.big-card b{display:block;font-size:26px;font-weight:900;line-height:1.15;margin-top:4px}
.big-card p{margin-top:6px;font-size:16px;opacity:.92}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:16px;border:0;font-weight:800;font-size:17px}
.btn.p{background:var(--p);color:#fff}
.btn.w{background:#fff;color:var(--p-d)}
.btn.o{background:transparent;border:2px solid var(--line);color:var(--g)}
.btn.full{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px;border-radius:12px;white-space:nowrap}
h2.t{font-size:24px;font-weight:900;color:var(--p-d);margin-top:22px}
.sub{color:var(--sub)}
.row{display:flex;align-items:center;gap:12px}
.hw{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.vid{position:relative;width:96px;height:96px;border-radius:16px;background:linear-gradient(150deg,#8E2A75,#4E0F3E);display:grid;place-items:center;color:#fff;overflow:hidden;border:0}
.vid::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 60%)}
.vid .pl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--p);position:relative}
.vid .who{position:absolute;left:6px;right:6px;bottom:5px;font-size:10.5px;font-weight:800;text-align:center;opacity:.95}
.hw b{display:block;font-size:18px;font-weight:800;color:var(--g)}
.hw .meta{font-size:15px;color:var(--sub);font-weight:600}
.done-b{margin-top:10px;width:100%;min-height:52px;border-radius:14px;border:2px solid var(--p);background:#fff;color:var(--p);font-weight:900;font-size:17px}
.done-b.on{background:var(--ok);border-color:var(--ok);color:#fff}
.prog{height:12px;border-radius:9px;background:var(--p-l);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--p);border-radius:9px}
.test{margin-top:14px}
.test .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.test .hd b{font-size:18px;font-weight:800}
.test .hd small{display:block;font-size:14px;color:var(--sub);font-weight:600}
.test .val{text-align:right}
.test .val strong{display:block;font-size:30px;font-weight:900;color:var(--p-d);line-height:1}
.test .val em{font-style:normal;font-size:14px;font-weight:800;color:var(--ok)}
.test svg{width:100%;height:auto;display:block;margin-top:10px}
.ref{display:inline-flex;margin-top:8px;font-size:14px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--ok-l);color:var(--ok)}
.ref.mid{background:var(--warn-l);color:var(--warn)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.msg{max-width:86%;padding:12px 15px;border-radius:18px;font-size:16.5px;line-height:1.45}
.msg.t{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px}
.msg.t small{display:block;font-size:12.5px;font-weight:800;color:var(--p);margin-bottom:3px}
.msg.u{align-self:flex-end;background:var(--p);color:#fff;border-radius:18px 4px 18px 18px}
.inrow{display:flex;gap:8px;margin-top:14px}
.inrow input{flex:1;min-width:0;height:56px;border-radius:16px;border:2px solid var(--line);padding:0 16px;font-size:17px;background:#fff;outline:none}
.inrow input:focus{border-color:var(--p)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12.5px;font-weight:800;color:var(--sub)}
.nav button svg{width:28px;height:28px}
.nav button.on{color:var(--p)}
.week{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wk{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border-radius:16px;border:1px solid var(--line);background:#fff;padding:12px}
.wk .n{width:44px;height:44px;border-radius:12px;background:var(--p-l);color:var(--p-d);display:grid;place-items:center;font-weight:900}
.wk.ok .n{background:var(--ok);color:#fff}
.wk.cur{border:2px solid var(--p)}
.wk b{font-size:16.5px}
.wk small{display:block;font-size:14px;color:var(--sub);font-weight:600}
.live{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.live .av{width:58px;height:58px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;position:relative}
.live .av::after{content:"NUEVO";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:8.5px;font-weight:900;padding:2px 5px;border-radius:5px;white-space:nowrap}
.up{background:var(--p-l);border:2px dashed var(--p-m)}
/* ---------- panel ---------- */
.a{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:56px;height:calc(100vh - 56px)}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .who .av{width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:900}
.side .who b{display:block;font-size:15px}
.side .who small{font-size:12.5px;color:var(--sub);font-weight:700}
.side button.it{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:12px;padding:11px 12px;font-weight:700;font-size:15px;color:var(--g);text-align:left}
.side button.it svg{width:20px;height:20px;color:var(--sub)}
.side button.it.on{background:var(--p-l);color:var(--p-d)}
.side button.it.on svg{color:var(--p)}
.side button.it .lk{margin-left:auto;font-size:12px}
.role{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.role p{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px 6px}
.main{padding:24px 26px 60px;min-width:0}
.main h1{font-size:28px;font-weight:900;color:var(--p-d)}
.main .lead{color:var(--sub);font-size:15.5px;margin-top:4px;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi small{font-size:13px;font-weight:700;color:var(--sub)}
.kpi b{display:block;font-size:30px;font-weight:900;color:var(--p-d);line-height:1.1;margin-top:4px}
.kpi em{font-style:normal;font-size:13px;font-weight:800;color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.box h3{font-size:17px;font-weight:900;color:var(--p-d);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box h3 small{font-size:13px;color:var(--sub);font-weight:700}
.shield{background:linear-gradient(150deg,var(--p),var(--p-d));color:#fff;border:0}
.shield h3{color:#fff}
.shield ul{list-style:none;margin-top:12px;display:grid;gap:8px}
.shield li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:15px}
.shield li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:900;font-size:13px}
.tw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;border-radius:99px;padding:3px 9px;background:var(--p-l);color:var(--p-d);white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.w{background:var(--warn-l);color:var(--warn)}
.chip.g{background:#EEE;color:#666}
.sel{height:36px;border-radius:10px;border:1.5px solid var(--line);padding:0 8px;background:#fff;font-size:14px;font-weight:700}
.sel:disabled{opacity:.6}
.tg{width:46px;height:26px;border-radius:99px;border:0;background:#D8D2D6;position:relative}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--p)}
.tg.on::after{left:23px}
.tg:disabled{opacity:.55;cursor:not-allowed}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.lv{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.lv .th{height:104px;background:linear-gradient(150deg,#8E2A75,#4E0F3E);display:grid;place-items:center;color:#fff;position:relative}
.lv .th .pl{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center}
.lv .th span{position:absolute;left:8px;bottom:6px;font-size:11.5px;font-weight:800}
.lv .bd{padding:10px 12px}
.lv b{display:block;font-size:14.5px}
.lv small{font-size:12.5px;color:var(--sub);font-weight:700}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-l);color:#7A4E07;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14.5px;margin-top:14px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--sub)}
.form input,.form select{height:44px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font-size:15.5px;font-weight:700;background:#fff;color:var(--g)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:var(--p-d);color:#fff;font-weight:800;font-size:15px;padding:13px 18px;border-radius:14px;max-width:92%;text-align:center;transition:.25s;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(30,10,25,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .in{width:100%;max-width:460px;background:#fff;border-radius:22px;padding:22px}
.modal h3{font-size:20px;font-weight:900;color:var(--p-d)}
.modal p{color:var(--sub);margin-top:6px;font-size:15px}
.mtabs{display:none}
@media (max-width:900px){
  .a{grid-template-columns:1fr}
  .side{position:sticky;top:56px;height:auto;z-index:20;flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .who{display:none}
  .side button.it{flex:none;padding:9px 12px;font-size:14px}
  .role{margin:0 0 0 6px;border:0;padding:0;display:flex;align-items:center}
  .role p{display:none}
  .main{padding:18px 16px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 1fr}
}
</style>
</head>

    return '<h1>Bodychronos en casa</h1><p class="lead">Ingresos nuevos sin una hora más de sala: tus clientes siguen tu método en casa entre sesión y sesión.</p><div class="kpis"><div class="kpi"><small>Clientes con “En casa”</small><b>' + casa + '</b><em>de ' + tot + '</em></div><div class="kpi"><small>Ingreso extra al mes</small><b>' + (casa * 25).toLocaleString('es-ES') + ' €</b><em>25 € por cliente</em></div><div class="kpi"><small>Horas de sala usadas</small><b>0</b><em>todo en vídeo y app</em></div><div class="kpi"><small>Tu tiempo a la semana</small><b>10 min</b><em>“Miguel responde”</em></div></div>' +
      '<div class="box" style="margin-top:14px"><h3>Si lo cogiera…</h3><div class="tw"><table><thead><tr><th>Clientes con “En casa”</th><th>Al mes</th><th>Al año</th></tr></thead><tbody>' + [0.15, 0.25, 0.35, 0.5].map(function (p) { var n = Math.round(tot * p); return '<tr><td><b>' + Math.round(p * 100) + ' %</b> · ' + n + ' clientes</td><td>' + (n * 25).toLocaleString('es-ES') + ' €</td><td><b>' + (n * 25 * 12).toLocaleString('es-ES') + ' €</b></td></tr>'; }).join('') + '</tbody></table></div></div>';
  }
  function renderA() {
    if (!isOwner() && (S.at === 'eq' || S.at === 'casa')) S.at = 'res';
    var V = { res: aRes, cli: aCli, med: aMed, met: aMet, eq: aEq, casa: aCasa };
    $('root').innerHTML = '<div class="a">' + aSide() + '<main class="main">' + (V[S.at] || aRes)() + '</main></div>';
  }
  function render() { $('vC').classList.toggle('on', S.view === 'c'); $('vA').classList.toggle('on', S.view === 'a'); if (S.view === 'a') renderA(); else renderC(); }

  function modal(html, onClick) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="in">' + html + '</div>'; document.body.appendChild(m); m.addEventListener('click', function (e) { if (e.target === m) { m.remove(); return; } var b = e.target.closest('button'); if (b) onClick(b, m); }); return m; }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.closest('.modal')) return; var d = b.dataset;
    if (d.view) { S.view = d.view; save(); render(); window.scrollTo(0, 0); return; }
    if (d.ct) { S.ct = d.ct; save(); render(); window.scrollTo(0, 0); return; }
    if (d.at) { S.at = d.at; save(); render(); window.scrollTo(0, 0); return; }
    if (d.done) { S.done[d.done] = !S.done[d.done]; save(); render(); if (S.done[d.done]) toast(hwDone() === 3 ? '¡Los 3 hechos! Ane lo verá en su panel' : '¡Bien! Ejercicio hecho'); return; }
    if (d.play) { toast('En la app real se abre el vídeo de Miguel explicándolo'); return; }
    if (d.addcasa) { me().casa = true; save(); render(); toast('Añadido “Bodychronos en casa”. Se cobra con tu cuota'); return; }
    if (d.perm) { var p = d.perm.split('|'); S.perms[p[0]][p[1]] = S.perms[p[0]][p[1]] ? 0 : 1; save(); render(); toast('Permiso actualizado'); return; }
    if (d.export) { toast('Exportación preparada. Queda registrado quién la ha hecho'); return; }
    if (d.newvid) { toast('Subes el vídeo desde el móvil y queda en el Método Miguel'); return; }
    if (d.leave) {
      var t = tm(d.leave), mine = S.cl.filter(function (c) { return c.tr === t.id && !S.gone[c.id]; });
      modal('<h3>' + t.n + ' se va del centro</h3><p>Tiene ' + mine.length * 10 + ' clientes. ¿A quién se los pasamos? Se llevan todo su historial: mediciones, ejercicios y mensajes. ' + t.n + ' pierde el acceso al momento.</p><select class="sel" id="toSel" style="width:100%;margin-top:14px;height:46px">' + TEAM.filter(function (x) { return x.id !== t.id && !S.gone[x.id]; }).map(function (x) { return '<option value="' + x.id + '">' + x.n + ' · ' + x.r + '</option>'; }).join('') + '</select><div style="display:flex;gap:8px;margin-top:16px"><button type="button" class="btn o sm" data-x="1">Cancelar</button><button type="button" class="btn p sm" data-ok="1">Pasar clientes y quitar acceso</button></div>', function (bb, m) {
        if (bb.dataset.x) { m.remove(); return; }
        if (bb.dataset.ok) { var to = $('toSel').value; mine.forEach(function (c) { c.tr = to; }); S.gone[t.id] = 1; save(); m.remove(); render(); toast('Hecho: ' + mine.length * 10 + ' clientes pasan a ' + tm(to).n + '. ' + t.n + ' ya no tiene acceso'); }
      });
      return;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'asSel') { S.as = t.value; S.at = 'res'; save(); render(); toast('Viendo el panel como ' + tm(S.as).n); return; }
    if (t.dataset && t.dataset.reas) { var c = S.cl.filter(function (x) { return x.id === t.dataset.reas; })[0]; c.tr = t.value; save(); toast(c.n.split(' ')[0] + ' pasa a ' + tm(t.value).n + ' con todo su historial'); }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault(); var f = e.target;
    if (f.id === 'cF') { var v = $('cI').value.trim(); if (!v) return; S.chat.push({ t: 0, x: v }); save(); render(); setTimeout(function () { S.chat.push({ t: 1, x: 'Recibido, Mari Carmen. Te contestamos en un rato. ¡Gracias por contárnoslo!' }); save(); if (S.view === 'c' && S.ct === 'chat') render(); window.scrollTo(0, document.body.scrollHeight); }, 900); return; }
    if (f.id === 'medF') {
      var fd = new FormData(f), c = S.cl.filter(function (x) { return x.id === fd.get('c'); })[0], l = last(c), m = { d: '2026-11-12' };
      ['sentar', 'equil', 'agarre', 'cintura'].forEach(function (k) { var v = parseFloat(String(fd.get(k) || '').replace(',', '.')); m[k] = isNaN(v) ? l[k] : v; });
      c.meds.push(m); save(); render(); toast('Guardado. ' + c.n.split(' ')[0] + ' ya lo ve en su app');
    }
  });
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
