<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="app-version" content="20261124134542">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galerna Taller</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e8590c">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Taller">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--b:#e8590c;--bt:#fff;--bs:rgba(232,89,12,.1);--bg:#f4f5f7;--p:#fff;--ln:#e5e7eb;--ln2:#d1d5db;--tx:#111827;--mu:#6b7280;--g:#16a34a;--gs:#dcfce7;--y:#d97706;--ys:#fef3c7;--r:#dc2626;--rs:#fee2e2;--bl:#2563eb;--bls:#dbeafe;--vi:#7c3aed;--vis:#ede9fe;--rad:14px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:14.5px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.hd{font-family:Manrope,Inter,sans-serif;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--ln2);background:var(--p);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#9ca3af}
.btn.pr{background:var(--b);color:var(--bt);border-color:var(--b)}
.btn.pr:hover{filter:brightness(1.06)}
.btn.ok{background:var(--g);color:#fff;border-color:var(--g)}
.btn.wa{background:#1fa855;color:#fff;border-color:#1fa855}
.btn.dk{background:#111827;color:#fff;border-color:#111827}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.big{padding:14px 18px;font-size:15.5px;width:100%}
.btn.ghost{border-color:transparent;background:transparent}
.btn.dan{color:var(--r);border-color:#fecaca}
.btn:disabled{opacity:.55;cursor:not-allowed}
.inp,.f input[type=text],.f input[type=tel],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=url],.f select,.f textarea{width:100%;background:#fff;border:1px solid var(--ln2);border-radius:10px;padding:10px 12px;outline:none;transition:.15s}
.inp:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px var(--bs)}
.f .fl{margin-bottom:12px}
.lbl{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:560px){.g2.st,.g3.st{grid-template-columns:minmax(0,1fr)}}
.hint{color:var(--mu);font-size:13px}
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border:1px solid #9ca3af;border-radius:4px;font-weight:700;font-size:12px;letter-spacing:.6px;overflow:hidden;line-height:1;font-family:ui-monospace,Menlo,Consolas,monospace;vertical-align:middle;white-space:nowrap}
.plate:before{content:'';width:5px;background:#1d4ed8}
.plate span{padding:3px 5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:#374151;white-space:nowrap}
.chip.g{background:var(--gs);color:#166534}.chip.y{background:var(--ys);color:#92400e}.chip.r{background:var(--rs);color:#991b1b}.chip.bl{background:var(--bls);color:#1e40af}.chip.vi{background:var(--vis);color:#5b21b6}.chip.b{background:var(--bs);color:var(--b)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.card{background:var(--p);border:1px solid var(--ln);border-radius:var(--rad);box-shadow:var(--sh)}
.empty{border:1.5px dashed var(--ln2);border-radius:12px;padding:18px;text-align:center;color:var(--mu);font-size:13.5px}
/* layout */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:#111827;color:#d1d5db;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--b);color:var(--bt);display:grid;place-items:center;font-weight:800;font-family:Manrope,Inter,system-ui,sans-serif;font-size:16px;flex:none}
.brand b{color:#fff;font-family:Manrope,Inter,system-ui,sans-serif;font-size:15px;line-height:1.15;display:block}
.brand small{color:#9ca3af;font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px;color:#cbd5e1;text-decoration:none;position:relative}
.nav:hover{background:#1f2937;color:#fff}
.nav.on{background:#1f2937;color:#fff}
.nav.on:before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--b)}
.nav .bd{margin-left:auto;background:var(--b);color:var(--bt);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.side .sp{flex:1}
.side .who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#1f2937;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--c,#6b7280);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:none}
.main{padding:24px 28px 100px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800}
.top p{color:var(--mu);font-size:13.5px}
.mtop{display:none}
.tabs{display:none}
@media(max-width:900px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
 .mtop b{font-family:Manrope,Inter,system-ui,sans-serif;font-size:15px}
 .mtop .r{margin-left:auto;display:flex;gap:8px;align-items:center}
 .main{padding:16px 14px 110px}
 .top h1{font-size:22px}
 .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mu);text-decoration:none;padding:4px 0;position:relative}
 .tabs a.on{color:var(--b);font-weight:600}
 .tabs .bd{position:absolute;top:-2px;left:calc(50% + 5px);background:var(--r);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px}
}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.kpi{padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--mu);display:block}
.kpi b{font-family:Manrope,Inter,system-ui,sans-serif;font-size:26px;font-weight:800;display:block;line-height:1.2;margin-top:2px}
.kpi small{font-size:12px;color:var(--mu)}
.kpi.ac{background:#111827;color:#fff;border-color:#111827}
.kpi.ac span,.kpi.ac small{color:#9ca3af}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{padding:14px}
.box-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.box-h h3{font-size:15px;font-weight:700}
.box-h .n{background:#f3f4f6;border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;color:#4b5563}
.box-h .r{margin-left:auto}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--ln);margin-bottom:8px;background:#fff;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--ln2);background:#fafafa}
.row .t{font-weight:600;font-size:14px;line-height:1.3}
.row .s{color:var(--mu);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.row .mn{min-width:0;flex:1}
.time{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:15px;min-width:46px;text-align:center;color:var(--b)}
.eur{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;white-space:nowrap}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
@media(max-width:900px){.board{grid-template-columns:repeat(5,86%)}}
.lane{background:#eceef1;border-radius:14px;padding:10px;scroll-snap-align:start;min-height:200px}
.lane-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;margin:2px 4px 10px}
.lane-h small{margin-left:auto;color:var(--mu);font-weight:600}
.job{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.job:hover{border-color:var(--ln2)}
.job .t{font-weight:600;font-size:13.5px;line-height:1.3;margin:6px 0 4px}
.job .s{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.job .ft{display:flex;align-items:center;gap:6px;margin-top:8px}
.job .ft .av{width:24px;height:24px;font-size:11px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{padding:6px 11px;border-radius:999px;border:1px solid var(--ln2);background:#fff;font-size:13px;font-weight:500}
.fchip.on{background:#111827;color:#fff;border-color:#111827}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.45);display:flex;justify-content:flex-end;animation:fi .15s}
.sheet{width:min(760px,100%);height:100%;background:var(--bg);overflow:auto;animation:sl .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.ov.c{align-items:center;justify-content:center;padding:16px}
.ov.c .sheet{height:auto;max-height:92vh;border-radius:18px;width:min(520px,100%);animation:up .2s}
@keyframes fi{from{opacity:0}}@keyframes sl{from{transform:translateX(40px);opacity:0}}@keyframes up{from{transform:translateY(16px);opacity:0}}
@media(max-width:640px){.ov.c{align-items:flex-end;padding:0}.ov.c .sheet{border-radius:18px 18px 0 0;max-height:94vh}}
.sh-h{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--ln);padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top))}
.sh-h .l1{display:flex;align-items:center;gap:10px}
.sh-h h2{font-size:18px;font-weight:800;flex:1;min-width:0;line-height:1.25}
.x{width:34px;height:34px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;flex:none}
.sh-b{padding:16px 18px 40px;flex:1}
.steps{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.stp{flex:1;min-width:64px;text-align:center;font-size:11px;font-weight:600;color:#9ca3af}
.stp i{display:block;height:5px;border-radius:5px;background:#e5e7eb;margin-bottom:5px}
.stp.done{color:#374151}.stp.done i{background:var(--b)}
.stp.now{color:var(--b)}.stp.now i{background:var(--b);opacity:.45}
.stabs{display:flex;gap:4px;margin-top:12px;background:#f3f4f6;border-radius:10px;padding:3px}
.stabs button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mu)}
.stabs button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sec{padding:14px;margin-bottom:12px}
.sec h3{font-size:14.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv span{color:var(--mu)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--ln);align-items:start}
.line:last-child{border-bottom:0}
.line .t{font-weight:600;font-size:14px}
.line .s{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--mu)}
.line img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);display:block}
.tot{display:grid;gap:4px;margin-top:10px;font-size:13.5px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-family:Manrope,Inter,system-ui,sans-serif;font-weight:800;font-size:18px;border-top:1px solid var(--ln);padding-top:8px;margin-top:4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.addph{width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--ln2);display:grid;place-items:center;color:var(--mu);font-size:12px;text-align:center;cursor:pointer;line-height:1.2}
.sig{width:100%;height:150px;background:#fff;border:1.5px dashed var(--ln2);border-radius:12px;touch-action:none;display:block}
.sig-ok{display:flex;align-items:center;gap:10px}
.sig-ok img{height:56px;background:#fff;border:1px solid var(--ln);border-radius:8px}
.note{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;font-size:13.5px;margin-bottom:8px;white-space:pre-wrap}
.note small{display:block;color:var(--mu);font-size:11.5px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:7px 10px;border-radius:8px;border:1px solid var(--ln2);background:#fff;font-size:12.5px;font-weight:600}
.seg button.on{background:#111827;color:#fff;border-color:#111827}
.fuel{display:flex;gap:4px}
.fuel button{flex:1;padding:8px 0;border:1px solid var(--ln2);background:#fff;border-radius:8px;font-size:12px;font-weight:600}
.fuel button.on{background:var(--b);color:var(--bt);border-color:var(--b)}
/* portal cliente */
.portal{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}
.p-h{background:var(--b);color:var(--bt);padding:22px 20px 26px;padding-top:calc(22px + env(safe-area-inset-top))}
.p-h .brand2{display:flex;align-items:center;gap:10px;font-weight:700;font-family:Manrope,Inter,system-ui,sans-serif}
.p-h .brand2 .logo{background:rgba(255,255,255,.2);color:inherit}
.p-h h1{font-size:24px;font-weight:800;margin-top:16px;line-height:1.2}
.p-h p{opacity:.85;font-size:14px;margin-top:4px}
.p-b{padding:16px;margin-top:-14px}
.pl{display:flex;gap:12px;padding:13px;border-bottom:1px solid var(--ln);align-items:flex-start}
.pl:last-child{border-bottom:0}
.pl input{width:22px;height:22px;accent-color:var(--b);margin-top:2px;flex:none}
.pl .mn{flex:1;min-width:0}
.pl .t{font-weight:600}
.pl .why{font-size:12.5px;color:var(--mu);margin-top:2px}
.pl img{width:60px;height:60px;object-fit:cover;border-radius:10px;flex:none}
.tl{display:grid;gap:0;margin-top:4px}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-i:last-child{padding-bottom:0}
.tl-i:not(:last-child):after{content:'';position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--ln)}
.tl-i.done:not(:last-child):after{background:var(--g)}
.tl-d{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln2);background:#fff;flex:none;display:grid;place-items:center;color:#fff}
.tl-i.done .tl-d{background:var(--g);border-color:var(--g)}
.tl-i.now .tl-d{border-color:var(--b);box-shadow:0 0 0 4px var(--bs)}
.tl-i.now .tl-d:before{content:'';width:9px;height:9px;border-radius:50%;background:var(--b)}
.tl-i b{font-size:14px;display:block}
.tl-i small{color:var(--mu);font-size:12.5px}
.demo-bar{position:sticky;top:0;z-index:30;background:#111827;color:#fff;font-size:12.5px;padding:8px 14px;display:flex;align-items:center;gap:10px;padding-top:calc(8px + env(safe-area-inset-top))}
.demo-bar a{margin-left:auto;color:#fff;font-weight:600}
/* web pública */
.w-nav{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:10}
.w-in{max-width:1080px;margin:0 auto;padding:0 18px}
.w-nav .w-in{display:flex;align-items:center;gap:12px;height:62px}
.w-nav b{font-family:Manrope,Inter,system-ui,sans-serif;font-size:16px}
.w-hero{background:#111827;color:#fff;padding:54px 0 60px;position:relative;overflow:hidden}
.w-hero:after{content:'';position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:var(--b);opacity:.22;filter:blur(10px)}
.w-hero h1{font-size:clamp(32px,5.4vw,54px);font-weight:800;line-height:1.05;max-width:640px;position:relative;z-index:1}
.w-hero h1 em{font-style:normal;color:var(--b)}
.w-hero p{color:#cbd5e1;max-width:520px;margin-top:14px;font-size:16px;position:relative;z-index:1}
.w-hero .acts{margin-top:24px;position:relative;z-index:1}
.w-pills{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px;color:#e5e7eb;font-size:13.5px;position:relative;z-index:1}
.w-pills span{display:flex;gap:6px;align-items:center}
.w-sec{padding:44px 0 0}
.w-sec h2{font-size:28px;font-weight:800;margin-bottom:6px}
.svcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
@media(max-width:760px){.svcs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svc{padding:16px}
.svc .ic{width:38px;height:38px;border-radius:10px;background:var(--bs);color:var(--b);display:grid;place-items:center;margin-bottom:10px}
.svc b{display:block;font-size:14.5px}
.svc small{color:var(--mu)}
.bk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-top:16px}
@media(max-width:760px){.bk{grid-template-columns:minmax(0,1fr)}}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;width:58px;padding:8px 0;border-radius:10px;border:1px solid var(--ln2);background:#fff;text-align:center}
.day small{display:block;font-size:10.5px;text-transform:uppercase;color:var(--mu);font-weight:600}
.day b{display:block;font-family:Manrope,Inter,system-ui,sans-serif;font-size:19px;font-weight:800}
.day.on{border-color:var(--b);background:var(--bs)}
.day:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.slot{padding:9px 0;border-radius:9px;border:1px solid var(--ln2);background:#fff;font-weight:600;font-size:13.5px}
.slot.on{background:var(--b);color:var(--bt);border-color:var(--b)}
.slot:disabled{opacity:.35;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{padding:7px 11px;border-radius:999px;border:1px solid var(--ln2);background:#fff;font-size:13px}
.chipb.on{background:var(--b);color:var(--bt);border-color:var(--b);font-weight:600}
.w-foot{margin-top:50px;background:#111827;color:#9ca3af;padding:30px 0 60px;font-size:13.5px}
.w-foot b{color:#fff}
/* doc resguardo */

function ordRow(o,right){const v=vehiculo(o.vehiculoId),c=cliente(o.clienteId);return `<div class="row" data-o="${o.id}"><div class="mn"><div class="t">${esc(v.modelo)} ${plate(v.matricula)}</div><div class="s">${esc(c.nombre)} · ${esc(o.motivo)}</div></div><div class="r">${right||''}</div></div>`}
function vHoy(){
 const abiertas=D.ordenes.filter(o=>o.estado!=='entregado');
 const esp=D.ordenes.filter(o=>o.estado==='aprobacion');
 const espEur=esp.reduce((a,o)=>a+conIva(sumL(o,l=>l.estado==='propuesta')),0);
 const mes=today().slice(0,7);
 const resp=D.ordenes.filter(o=>o.respondido&&o.respondido.slice(0,7)===mes);
 const aprob=resp.reduce((a,o)=>a+conIva(sumL(o,l=>l.estado==='aprobada')),0);
 const prop=resp.reduce((a,o)=>a+conIva(sumL(o,l=>l.estado!=='propuesta')),0);
 const tasa=prop?Math.round(aprob/prop*100):0;
 const recup=D.recs.filter(r=>r.tipo==='aplazado'&&r.estado==='pendiente').reduce((a,r)=>a+conIva(r.importe),0);
 const citas=D.citas.filter(c=>c.fecha===today()&&c.estado==='pendiente').sort((a,b)=>a.hora.localeCompare(b.hora));
 const listos=D.ordenes.filter(o=>o.estado==='listo');
 const h=new Date().getHours();
 return `<div class="top"><div><h1>${h<14?'Buenos días':h<21?'Buenas tardes':'Buenas noches'}, ${esc(yo().nombre)}</h1><p>${fL()} · ${abiertas.length} coches en el taller</p></div><div class="acts"><button class="btn" data-a="nueva-cita">${sv(I.cal,16)} Nueva cita</button><button class="btn pr" data-a="recepcion">${sv(I.plus,16)} Recibir coche</button></div></div>
 <div class="kpis">
  <div class="card kpi ac"><span>Esperando respuesta del cliente</span><b>${eur(espEur)}</b><small>${esp.length} presupuesto${esp.length===1?'':'s'} enviado${esp.length===1?'':'s'}</small></div>
  <div class="card kpi"><span>Aprobado este mes</span><b style="color:var(--g)">${eur(aprob)}</b><small>${tasa}% de lo presupuestado</small></div>
  <div class="card kpi"><span>Por recuperar</span><b style="color:var(--b)">${eur(recup)}</b><small>trabajos aplazados</small></div>
  <div class="card kpi"><span>Citas hoy</span><b>${citas.length}</b><small>${D.citas.filter(c=>c.origen==='web'&&c.estado==='pendiente').length} por la web</small></div>
 </div>
 <div class="cols">
  <div class="card box"><div class="box-h"><h3>Citas de hoy</h3><span class="n">${citas.length}</span><a class="r btn xs" href="#agenda">Agenda</a></div>
   ${citas.length?citas.map(c=>`<div class="row" data-cita="${c.id}"><div class="time">${c.hora}</div><div class="mn"><div class="t">${esc(c.nombre)}</div><div class="s">${esc(c.vehiculo)} ${plate(c.matricula)}</div><div class="s">${esc(c.motivo)} ${origenChip(c.origen)}</div></div><div class="r"><button class="btn xs pr" data-a="recibir" data-id="${c.id}">Recibir</button></div></div>`).join(''):'<div class="empty">No quedan citas para hoy</div>'}</div>
  <div class="card box"><div class="box-h"><h3>Esperando al cliente</h3><span class="n">${esp.length}</span></div>
   ${esp.length?esp.map(o=>ordRow(o,`<div style="text-align:right"><div class="eur">${eur(conIva(sumL(o,l=>l.estado==='propuesta')))}</div><small class="hint">${o.enviado?ago(o.enviado):'sin enviar'}</small></div>`)).join(''):'<div class="empty">Ningún presupuesto pendiente</div>'}</div>
  <div class="card box"><div class="box-h"><h3>Listos para entregar</h3><span class="n">${listos.length}</span></div>
   ${listos.length?listos.map(o=>ordRow(o,`<button class="btn xs ok" data-a="entregar" data-id="${o.id}">Entregar</button>`)).join(''):'<div class="empty">Nada listo todavía</div>'}</div>
 </div>`;
}
const origenChip=o=>o==='web'?'<span class="chip b">Web</span>':o==='whatsapp'?'<span class="chip g">WhatsApp</span>':'<span class="chip">Teléfono</span>';
function vAgenda(){

 return `<div class="top"><div><h1>Agenda</h1><p>Citas de la web, WhatsApp y teléfono en un solo sitio · ${D.cfg.capacidad} coche${D.cfg.capacidad>1?'s':''} por hueco</p></div><div class="acts"><a class="btn" href="#web">${sv(I.globe,16)} Ver web de citas</a><button class="btn pr" data-a="nueva-cita">${sv(I.plus,16)} Nueva cita</button></div></div>
 ${dias.map(f=>{const cs=D.citas.filter(c=>c.fecha===f&&c.estado!=='anulada').sort((a,b)=>a.hora.localeCompare(b.hora));const libres=D.cfg.horas.reduce((a,h)=>a+Math.max(0,D.cfg.capacidad-cs.filter(c=>c.hora===h).length),0);

function recsAuto(){
 // ITV y revisiones próximas detectadas de la ficha del vehículo (sin recordatorio ya creado)
 const out=[];
 D.vehiculos.forEach(v=>{
  [['itv','ITV',v.itv],['revision','Revisión',v.revision]].forEach(([t,l,f])=>{
   if(!f)return;const d=days(f);
   if(d<=30&&!D.recs.some(r=>r.vehiculoId===v.id&&r.tipo===t&&r.fecha===f))out.push({id:'auto-'+t+'-'+v.id,tipo:t,vehiculoId:v.id,clienteId:v.clienteId,fecha:f,texto:l+(d<0?' vencida':' en '+d+' día'+(d===1?'':'s')),importe:0,estado:'pendiente',auto:true});
  });
 });
 return out;
}
function recMsg(r){
 const c=cliente(r.clienteId),v=vehiculo(r.vehiculoId),n=c.nombre.split(' ')[0],t=D.cfg.nombre,link=location.origin+location.pathname+location.search+'#web';
 if(r.tipo==='itv')return `Hola ${n}, te escribimos de ${t}. A tu ${v.modelo} (${v.matricula}) ${days(r.fecha)<0?'se le ha pasado la ITV':'le toca la ITV el '+fF(r.fecha)}. ¿Te hacemos una pre-ITV para que la pase a la primera? Puedes coger cita aquí: ${link}`;
 if(r.tipo==='revision')return `Hola ${n}, desde ${t} te recordamos que a tu ${v.modelo} (${v.matricula}) le toca la revisión. Coge cita cuando te venga bien: ${link}`;
 if(r.tipo==='aplazado')return `Hola ${n}, te escribimos de ${t}. En la última visita dejamos pendiente: ${r.texto} en tu ${v.modelo}. ¿Te reservamos un hueco esta semana? Coge cita aquí: ${link}`;
 return `Hola ${n}, gracias por confiar en ${t}. ¿Nos dejas una reseña? Nos ayuda muchísimo: ${D.cfg.google}`;
}
function vRecuperar(){
 const all=[...recsAuto(),...D.recs.filter(r=>r.estado==='pendiente')].sort((a,b)=>a.fecha.localeCompare(b.fecha));
 const env=D.recs.filter(r=>r.estado==='enviado').length;
 const grp=[['aplazado','Trabajos aplazados','El cliente dijo "ahora no". Aquí está el dinero que puedes recuperar.'],['itv','ITV próximas','Ofrece pre-ITV antes de que vayan a la estación.'],['revision','Revisiones que tocan','Que vuelvan contigo y no al taller de al lado.'],['resena','Reseñas en Google','Pide la reseña justo después de entregar.']];

 <p class="hint">Con la conexión oficial de WhatsApp Business estos avisos salen solos cada mañana. En esta demo se abren en tu WhatsApp para que veas el mensaje.</p>`;

let OV=null,OTAB='presu';
function closeOv(){OV=null;$('#ov-root').innerHTML=''}
function openOv(o){OV=o;renderOv()}
function renderOv(){
 if(!OV){$('#ov-root').innerHTML='';return}
 const r=$('#ov-root'),scroll=r.querySelector('.sheet')?.scrollTop||0,keep={};
 $$('[data-keep]',r).forEach(e=>keep[e.dataset.keep]=e.value);
 let h='',center=false;
 if(OV.k==='orden')h=ovOrden(orden(OV.id));
 else if(OV.k==='recepcion')h=ovRecepcion(),center=false;
 else if(OV.k==='cita')h=ovCita(),center=true;
 else if(OV.k==='yo')h=ovYo(),center=true;
 else if(OV.k==='resguardo')h=ovResguardo(orden(OV.id));
 else if(OV.k==='linea')h=ovLinea(),center=true;
 else if(OV.k==='veh')h=ovVeh(),center=true;
 const fresh=!r.firstChild;
 r.innerHTML=`<div class="ov ${center?'c':''}" ${fresh?'':'style="animation:none"'}><div class="sheet" ${fresh?'':'style="animation:none"'}>${h}</div></div>`;
 $$('[data-keep]',r).forEach(e=>{if(keep[e.dataset.keep]!=null)e.value=keep[e.dataset.keep]});
 r.querySelector('.sheet').scrollTop=scroll;
 $$('canvas.sig',r).forEach(initSig);
}
function steps(o){const i=ESTADOS.findIndex(e=>e[0]===o.estado);return `<div class="steps">${ESTADOS.map((e,j)=>`<div class="stp ${j<i?'done':j===i?'now':''}"><i></i>${e[1]}</div>`).join('')}</div>`}
function ovOrden(o){

function initSig(cv){
 const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
 const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111827';
 let dn=false,last=null;cv._dirty=false;
 const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dn=true;last=pt(e);cv.setPointerCapture(e.pointerId)};

function entregar(o){
 const now=new Date().toISOString();o.estado='entregado';o.entregado=now;
 const v=vehiculo(o.vehiculoId);v.km=Math.max(v.km||0,o.km||0);
 if(!D.recs.some(r=>r.tipo==='resena'&&r.clienteId===o.clienteId&&r.estado==='pendiente'))D.recs.push({id:uid('r'),tipo:'resena',vehiculoId:o.vehiculoId,clienteId:o.clienteId,fecha:today(),texto:'Pedir reseña tras '+o.motivo.toLowerCase(),importe:0,estado:'pendiente'});
 save();closeOv();renderApp();toast('Entregado. Reseña añadida a "Recuperar".');
}
document.addEventListener('input',e=>{if(e.target.id==='cq'){CQ=e.target.value;const p=e.target.selectionStart;renderApp();const n=$('#cq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{
 const f=e.target.closest('[data-f]');if(f&&OV&&OV.k==='orden'){const o=orden(OV.id);o[f.dataset.f]=f.value;save();renderOv();refresh();toast('Guardado')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&OV)closeOv()});
document.addEventListener('submit',e=>{
 const f=e.target;e.preventDefault();const fd=new FormData(f),v=k=>String(fd.get(k)||'').trim(),now=new Date().toISOString();
 if(f.id==='f-l'){const o=orden(OV.oid),cant=parseFloat(String(v('cant')).replace(',','.'))||1,precio=parseFloat(String(v('precio')).replace(',','.'));if(!v('concepto')||isNaN(precio))return toast('Pon concepto y precio');
  o.lineas.push({id:uid('l'),concepto:v('concepto'),tipo:LF.tipo,cant,precio,prioridad:LF.prio,estado:'propuesta',foto:LF.foto||''});if(o.estado==='recepcion')o.estado='diagnostico';save();LF=null;OV={k:'orden',id:o.id};OTAB='presu';renderOv();refresh();toast('Añadido');return}
 if(f.id==='f-rec'){
  const mat=v('matricula').toUpperCase();if(np(mat).length<4)return toast('Revisa la matrícula');
  let veh=D.vehiculos.find(x=>np(x.matricula)===np(mat)),cli=veh?cliente(veh.clienteId):D.clientes.find(c=>dg(c.telefono)===dg(v('telefono')));
  if(!cli||!cli.id){cli={id:uid('c'),nombre:v('nombre'),telefono:v('telefono')};D.clientes.push(cli)}else{cli.nombre=v('nombre')||cli.nombre;cli.telefono=v('telefono')||cli.telefono}
  if(!veh){veh={id:uid('v'),clienteId:cli.id,matricula:mat,modelo:v('modelo')||'Vehículo',km:+v('km')||0,itv:'',revision:''};D.vehiculos.push(veh)}else{veh.modelo=v('modelo')||veh.modelo;veh.km=+v('km')||veh.km}
  const cv=$('#ov-root canvas.sig'),img=sigData(cv);
  const o={id:uid('o'),num:'OR-'+(D.seq++),vehiculoId:veh.id,clienteId:cli.id,motivo:v('motivo')||OV.srv||'Revisión',km:+v('km')||veh.km,combustible:OV.fuel??2,estado:'recepcion',mecanico:v('mecanico'),entrada:now,prevista:v('prevista')||today(),renuncia:!!fd.get('renuncia'),lineas:[],notas:[],fotos:OV.fotos||[],firmaRecep:img?{img,nombre:cli.nombre,ts:now}:null};
  D.ordenes.push(o);if(OV.cita){const c=D.citas.find(x=>x.id===OV.cita);if(c)c.estado='recibida'}
  save();OTAB='presu';OV={k:'orden',id:o.id};renderOv();refresh();toast('Orden '+o.num+' creada');return}
 if(f.id==='f-cita'){D.citas.push({id:uid('ct'),fecha:v('fecha'),hora:v('hora'),nombre:v('nombre'),telefono:v('telefono'),matricula:v('matricula').toUpperCase(),vehiculo:v('vehiculo'),motivo:v('motivo'),nota:'',origen:v('origen'),estado:'pendiente'});save();closeOv();renderApp();toast('Cita guardada');return}
 if(f.id==='f-cfg'){const c=D.cfg;['nombre','tipo','color','registro','telefono','whatsapp','direccion','google','garantia'].forEach(k=>c[k]=v(k)||c[k]);c.precioHora=+v('precioHora')||c.precioHora;c.iva=+v('iva')||0;c.capacidad=Math.max(1,+v('capacidad')||1);const hs=v('horas').split(/[,\s]+/).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,'0'));if(hs.length)c.horas=hs.sort();save();applyBrand();renderApp();toast('Ajustes guardados');return}
 if(f.id==='f-u'){D.equipo.push({id:uid('u'),nombre:v('n'),rol:v('rol'),color:['#e11d48','#2563eb','#16a34a','#7c3aed','#ea580c','#0891b2'][D.equipo.length%6]});save();renderApp();return}
 if(f.id==='f-web'){const err=$('#w-err');err.textContent='';
  if(!WB.srv)return err.textContent='Elige qué necesitas.';if(!WB.day||!WB.slot)return err.textContent='Elige día y hora.';if(np(v('matricula')).length<4||!v('nombre')||dg(v('telefono')).length<9)return err.textContent='Revisa matrícula, nombre y móvil.';if(!fd.get('ok'))return err.textContent='Acepta el uso de tus datos.';
  if(wCount(WB.day,WB.slot)>=D.cfg.capacidad){WB.slot='';wSlotsR();return err.textContent='Esa hora se acaba de llenar.'}
  D.citas.push({id:uid('ct'),fecha:WB.day,hora:WB.slot,nombre:v('nombre'),telefono:v('telefono'),matricula:v('matricula').toUpperCase(),vehiculo:v('vehiculo'),motivo:WB.srv,nota:v('nota'),origen:'web',estado:'pendiente'});save();
  $('#w-ok').innerHTML=`<div class="card box" style="margin-top:10px;background:var(--gs);border-color:#bbf7d0"><b>¡Cita reservada!</b><br>${fL(WB.day)} a las ${WB.slot}. Te escribiremos por WhatsApp para confirmar.<br><a class="btn sm" style="margin-top:8px" href="#agenda">Ver cómo le llega al taller →</a></div>`;
  f.querySelector('button.big').disabled=true;WB.slot='';wDaysR();wSlotsR();return}
 if(f.id==='f-wq'){WQ=v('q');wQ();return}
});

load();route();
</script>
<script id="upd-chk">/* Se recarga sola cuando hay una versión nueva (útil en apps añadidas a la pantalla de inicio) */
(function(){var cur=(document.querySelector('meta[name=app-version]')||{}).content,busy=false,last=0;
function editing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value}
async function chk(){if(busy||Date.now()-last<10000)return;busy=true;last=Date.now();
 try{var r=await fetch(location.pathname,{cache:'no-store'});if(r.ok){var t=await r.text(),m=t.match(/name="app-version" content="([^"]+)"/);
  if(m&&cur&&m[1]!==cur&&!editing()){await fetch(location.pathname,{cache:'reload'}).catch(function(){});location.reload();return}}}catch(e){}
 busy=false}
document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()});window.addEventListener('pageshow',chk);setTimeout(chk,2500);})();
</script>
