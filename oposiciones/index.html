<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Oposiciones</title>
<meta name="description" content="Demo privada: app de seguimiento para academias de oposiciones físicas">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luis Altuna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Oposiciones">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Producto: app del opositor (móvil) + panel del preparador. Números grandes en condensada, como un marcador de pista. */
:root{
  --brand:#0B1F3A; --brand-2:#132C50; --acc:#6CC4F0; --acc-soft:#E4F4FC; --on-acc:#0B1F3A;
  --ink:#0E1726; --sub:#5A6577; --paper:#F2F4F7; --card:#FFFFFF; --line:#E1E5EB;
  --ok:#1E7A4C; --ok-soft:#E2F3EA; --warn:#9A5B00; --warn-soft:#FCEFD9; --bad:#B42318; --bad-soft:#FBE4E1;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.45 var(--body);padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
/* switch */
.switch{position:sticky;top:0;z-index:20;display:flex;gap:4px;padding:8px max(12px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.switch button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--sub)}
.switch button.on{background:var(--brand);color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}
.stage{max-width:1180px;margin:0 auto}
#paneC[data-hidden="true"],#paneA[data-hidden="true"]{display:none}
/* ---------- APP ---------- */
.app{max-width:460px;margin:0 auto;min-height:calc(100vh - 54px);display:flex;flex-direction:column;background:var(--paper);position:relative}
.scroll{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px max(16px,env(safe-area-inset-left,0px)) 100px}
.scroll > *{flex-shrink:0}
.hdr{display:flex;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--acc)}
.hdr .av{background:var(--acc);color:var(--on-acc)}
.hdr .word{color:#fff}
.word{font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:16px;border:0;background:none;padding:0;display:flex;align-items:center;gap:8px}
.word i{font-style:normal;color:var(--acc);filter:brightness(.8)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;flex:none}
h1.t{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.st{color:var(--sub);margin:2px 0 0;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--line)}
.card h3{color:var(--brand);margin:0;font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ch span{font-size:12.5px;color:var(--sub);font-weight:600}
.bt{height:46px;border-radius:12px;border:0;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.bt.acc{background:var(--acc);color:var(--on-acc)}
.bt.dark{background:var(--brand);color:#fff}
.bt.ghost{background:transparent;border:1.5px solid var(--line)}
.bt.ghost-l{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff}
.bt.full{width:100%}
.bt[aria-disabled="true"]{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row2{display:flex;gap:10px}
.row2 > *{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--paper);color:var(--sub)}
.chip.on-dark{background:rgba(255,255,255,.14);color:#fff}
/* hero marcador */
.board{background:var(--brand);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.05)}
.board .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.board .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.big{font-family:var(--cond);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.01em}
.big small{font-size:22px;opacity:.7;margin-left:4px}
.days{text-align:right}
.days b{font-family:var(--cond);font-size:40px;line-height:.9;display:block}
.bars{display:grid;gap:8px;position:relative;z-index:1}
.bar-r{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.trk{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.trk i.lo{background:#FF8A7A}
.bar-r b{font-family:var(--cond);font-size:17px;text-align:right}
.focus{display:flex;gap:12px;align-items:center}
.focus .ic{width:42px;height:42px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;flex:none;color:var(--brand)}
.focus p{margin:0;font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start}
.note p{margin:0;font-size:14.5px}
/* pruebas */
.tcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tcard .tn{font-weight:700;font-size:16px}
.tcard .tv{color:var(--sub);font-size:13.5px}
.pts{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1;text-align:right}
.pts small{font-size:14px;color:var(--sub);font-weight:600}
.tcard .trk2{grid-column:1/-1;height:6px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:6px}
.tcard .trk2 i{display:block;height:100%;background:var(--acc)}
.pts{color:var(--brand)}
.tcard .trk2 i.lo{background:var(--bad)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-weight:700;color:var(--sub);height:32px}
.field{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;width:100%;min-width:0;font-size:16px}
.field:focus{border-color:var(--brand);outline:none}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--sub)}
table.bar{width:100%;border-collapse:collapse;font-size:13.5px}
table.bar th,table.bar td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.bar th{font-size:12px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
table.bar tr.me td{background:var(--acc-soft);font-weight:700}
.marks{display:flex;flex-direction:column}
.marks div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.marks div:last-child{border-bottom:0}
/* plan */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--brand);color:#fff}
.wd{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.wd:last-child{border-bottom:0}
.wd .d{font-family:var(--cond);font-weight:700;font-size:15px;text-transform:uppercase;text-align:center;line-height:1.05}
.wd .d small{display:block;font-size:12px;color:var(--sub);font-family:var(--body)}
.wd b{display:block;font-size:15px}
.wd span.x{font-size:13px;color:var(--sub)}
.wd.today .d{color:var(--brand);background:var(--acc-soft);border-radius:10px;padding:4px 0}
.wd.rest b{color:var(--sub);font-weight:600}
.ex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.ex p{margin:0;font-weight:600}
.ex p span{display:block;font-weight:500;color:var(--sub);font-size:13.5px}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.meal{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.meal:last-child{border-bottom:0}
.meal b{width:84px;flex:none}
/* progreso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{font-size:12px;color:var(--sub);font-weight:700}
.kpi b{color:var(--brand);display:block;font-family:var(--cond);font-size:26px;line-height:1.1}
.kpi small{font-size:12px;color:var(--sub)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
svg{display:block;max-width:100%;height:auto}
/* chat */
.bub{max-width:85%;padding:10px 13px;border-radius:16px;font-size:14.5px;margin:0;white-space:pre-line}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.coach{align-self:flex-start;background:var(--acc-soft);border-bottom-left-radius:4px}
.bub .tag{display:block;margin-top:6px;font-size:11.5px;color:var(--sub);font-weight:700}
.bub .tag.esc{color:var(--warn)}
.bub .who{display:block;font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:2px}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;flex-shrink:0}
.sugg button{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.compose{display:flex;gap:8px;padding:8px 16px 12px;background:var(--paper);flex-shrink:0}
.compose input{flex:1;min-width:0;height:46px;border-radius:999px;border:1.5px solid var(--line);padding:0 16px;background:var(--card)}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.typing{display:flex;gap:4px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chatwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.chatwrap .scroll{padding-bottom:12px;gap:8px}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:15}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--sub);padding:6px 0}
.nav button.on{color:var(--acc)}
.nav button{position:relative}
.nav button.on::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.nav{border-top:1px solid var(--line)}
.nav svg{width:22px;height:22px}
.chat-view{height:calc(100dvh - 54px);min-height:0!important}
.chat-view .chatwrap{min-height:0}
.chat-view .chatwrap .scroll{overflow-y:auto;min-height:0}
.chat-view .nav{position:static;transform:none;left:auto;max-width:none}
/* flow */
.flow{flex:1;display:flex;flex-direction:column;min-height:calc(100vh - 54px)}
.fl-top{padding:12px 16px;background:var(--card);border-top:3px solid var(--acc);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:sticky;top:54px;z-index:5}
.fl-top b{font-family:var(--cond);font-size:20px}
.fl-top span{font-size:13px;color:var(--sub)}
.ptrk{height:5px;border-radius:99px;background:var(--paper);overflow:hidden}
.ptrk i{display:block;height:100%;background:var(--acc);transition:width .4s}
.fl-msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px}
.fl-bot{display:flex;gap:8px;align-items:flex-end}
.fl-av{width:30px;height:30px;border-radius:50%;background:var(--brand);border:2px solid var(--acc);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.fl-sys{align-self:center;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin:6px 0}
.fl-in{position:sticky;bottom:0;background:var(--paper);padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.qr{display:flex;flex-wrap:wrap;gap:8px}
.qr button{min-height:42px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;text-align:left}
.qr button.on{border-color:var(--brand);background:var(--acc-soft)}
.qs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qs button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-family:var(--cond);font-size:20px;font-weight:700}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.stepper{display:flex;align-items:center;gap:16px;justify-content:center}
.stepper button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700}
.stepper b{font-family:var(--cond);font-size:30px;min-width:96px;text-align:center}
.fl-row{display:flex;gap:8px}
.fl-row input{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;background:var(--card);font-size:16px}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.sum span{background:var(--paper);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--sub)}
.sum b{display:block;color:var(--ink);font-size:14px}
/* splash */
.splash{min-height:calc(100vh - 54px);background:var(--brand);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:28px max(22px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));position:relative;overflow:hidden}
.lanes{position:absolute;inset:0;opacity:.13;pointer-events:none}
.splash .kick{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.8;position:relative}
.splash h1{font-family:var(--cond);font-weight:700;font-size:clamp(46px,14vw,72px);line-height:.92;margin:0;text-transform:uppercase;letter-spacing:.005em;position:relative;overflow-wrap:anywhere}
.splash h1 i{font-style:normal;color:var(--acc)}
.splash .tag{font-size:18px;max-width:28ch;opacity:.92;margin:0;position:relative}
.splash .opos{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.splash .opos span{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.splash .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;text-align:center;font-size:12px;opacity:.75;position:relative}
.glogo{height:13px;width:auto;display:block}
.blogo{width:min(190px,52vw);aspect-ratio:1;border-radius:50%;display:block;max-width:100%;position:relative}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;text-align:center}
/* ---------- PANEL ---------- */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 54px)}
.side{background:var(--brand);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side .bn{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;padding:0 10px}
.side .who{font-size:12.5px;opacity:.7;padding:0 10px 12px}
.side button{display:flex;align-items:center;gap:10px;height:40px;border:0;border-radius:10px;background:transparent;color:rgba(255,255,255,.82);font-weight:600;padding:0 10px;text-align:left}
.side button.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.side button .n{margin-left:auto;background:var(--acc);color:var(--on-acc);border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.side .pow{margin-top:auto;padding:14px 10px 0;opacity:.7;font-size:11.5px;display:flex;flex-direction:column;gap:6px}
.main{padding:24px max(16px,env(safe-area-inset-right,0px)) 60px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mh h2{color:var(--brand);font-family:var(--cond);font-size:32px;margin:0;line-height:1}
.mh p{margin:4px 0 0;color:var(--sub);max-width:70ch}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:14px;padding:14px}
.stat span{font-size:12.5px;color:var(--sub);font-weight:700}
.stat b{color:var(--brand);display:block;font-family:var(--cond);font-size:34px;line-height:1.05}
.stat small{color:var(--sub);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.box h3{color:var(--brand);margin:0 0 12px;font-family:var(--cond);font-size:20px}
.box h3 small{font-family:var(--body);font-size:12.5px;color:var(--sub);font-weight:600;margin-left:6px}
.alert{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .sev{width:8px;height:38px;border-radius:4px;background:var(--warn)}
.alert .sev.bad{background:var(--bad)}
.alert b{display:block;font-size:14.5px}
.alert span{font-size:13px;color:var(--sub)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{background:var(--paper);text-align:left;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--paper)}
.mini{display:flex;gap:3px;align-items:flex-end;height:22px}
.mini i{width:8px;border-radius:2px;background:var(--brand);display:block}
.mini i.lo{background:var(--bad)}
.btn-a{height:38px;border-radius:10px;border:0;padding:0 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-a.pri{background:var(--brand);color:#fff}
.btn-a.sec{background:var(--card);border:1.5px solid var(--line)}
.btn-a.acc{background:var(--acc);color:var(--on-acc)}
.form{display:flex;flex-direction:column;gap:10px}
.inp,.sel,.ta{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;width:100%;min-width:0}
.ta{height:auto;min-height:90px;padding:10px 12px;resize:vertical;line-height:1.45}
.rep{white-space:pre-line;background:var(--paper);border-radius:12px;padding:14px;font-size:14px;line-height:1.55}
.rule{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.rule b{font-size:14px}
.rule p{margin:0;font-size:14px;color:var(--sub)}
.empty{padding:26px;text-align:center;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:12px}
.pill-o{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--paper)}
@media (min-width:1000px){
  .switch{display:none}
  .stage{display:grid;grid-template-columns:440px minmax(0,1fr);max-width:none;gap:0}
  #paneC[data-hidden="true"],#paneA[data-hidden="true"]{display:block}
  #paneC{border-right:1px solid var(--line);height:100vh;overflow:auto;position:sticky;top:0}
  #paneA{height:100vh;overflow:auto}
  .app,.flow,.splash{min-height:100vh}
  .chat-view{height:100vh}
  .fl-top{top:0}
  .nav{position:sticky;transform:none;left:auto}
  .adm{min-height:100vh}
}
@media (max-width:999px){
  .adm{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;padding:10px;gap:4px;position:sticky;top:54px;z-index:5}
  .side .bn,.side .who,.side .pow{display:none}
  .side button{flex:none}
  .main{padding:18px max(16px,env(safe-area-inset-left,0px)) 60px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .rule{grid-template-columns:1fr}
}

/* ===== Tema oscuro de marca ===== */
:root{--ink:#F3F6FB;--sub:#A9B6CA;--paper:#070C18;--card:rgba(255,255,255,.065);--card-2:rgba(255,255,255,.11);--line:rgba(255,255,255,.12);--hi:#FFFFFF;
  --c1:#4DA3FF;--c2:#FF5A5F;--c3:#FFC23D;--c4:#38D39F;--c5:#B98CFF;color-scheme:dark}
html{background:#05070D}
body{background:radial-gradient(900px 520px at 105% -8%,var(--glow,rgba(215,25,42,.35)),transparent 62%),radial-gradient(900px 700px at -25% 35%,var(--glow2,rgba(40,70,140,.55)),transparent 65%),linear-gradient(180deg,var(--brand) 0%,#05070D 85%);background-attachment:fixed;background-color:#05070D}
.app,.flow{background:transparent}
.switch{background:rgba(5,9,20,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.switch button{color:var(--sub)}
.hdr{background:rgba(5,9,20,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card,.tcard,.kpi,.stat,.box{background:var(--card);border-color:var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h3,.kpi b,.stat b,.box h3,.mh h2,.pts,h1.t{color:var(--hi)}
.bt.dark{background:#FFFFFF;color:#0B1324}
.bt.ghost{border-color:rgba(255,255,255,.25);color:#fff}
.board{background:linear-gradient(140deg,var(--brand-2),var(--brand) 60%,#05070D);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.nav{background:rgba(6,10,22,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top-color:var(--line)}
.nav button{color:#7F8EA6}
.seg{background:var(--card);border-color:var(--line)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.tcard .trk2,.ptrk,.trk{background:rgba(255,255,255,.1)}
.ex i,.sum span,.rep,.pill-o,.chip.mute{background:rgba(255,255,255,.09);color:var(--sub)}
.rep{color:var(--ink)}
.field,.inp,.sel,.ta,.fl-row input,.compose input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
.field:focus,.inp:focus,.fl-row input:focus,.compose input:focus{border-color:var(--acc);outline:none}
.fl-top{background:rgba(5,9,20,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.fl-in,.compose{background:rgba(5,9,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.qr button,.qs button,.stepper button{background:var(--card-2);border-color:rgba(255,255,255,.18);color:#fff}
.qr button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.bub.bot{background:var(--card-2);border-color:var(--line)}
.bub.me{background:var(--acc);color:var(--on-acc)}
.bub.coach{background:#FFFFFF;color:#0E1726}
.bub .tag{color:var(--sub)}
.sugg button{background:var(--card);border-color:var(--line);color:#fff}
.send{background:var(--acc);color:var(--on-acc)}
.typing{background:var(--card-2);border-color:var(--line)}
table.bar th,table.bar td,table.t td,table.t th,.marks div,.wd,.ex,.meal,.alert,.rule{border-color:var(--line)}
table.bar tr.me td{background:var(--acc);color:var(--on-acc)}
table.t th{background:rgba(255,255,255,.05)}
table.t tr.click:hover td{background:rgba(255,255,255,.05)}
.wd.today .d{background:var(--acc);color:var(--on-acc)}
.toast{background:#FFFFFF;color:#0B1324;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.side{background:rgba(5,9,20,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--line)}
.focus .ic{background:var(--acc);color:var(--on-acc)}
.btn-a.sec{background:var(--card-2);border-color:rgba(255,255,255,.2);color:#fff}
.btn-a.pri{background:#fff;color:#0B1324}
.mini i{background:#fff}
.av{background:var(--acc);color:var(--on-acc)}
.chip.ok{background:rgba(56,211,159,.16);color:#5BE3B3}
.chip.warn{background:rgba(255,194,61,.16);color:#FFD36B}
.chip.bad{background:rgba(255,90,95,.18);color:#FF8A8D}
.alert .sev{background:var(--c3)}
.alert .sev.bad{background:var(--c2)}
#paneC{border-color:var(--line)!important}
.qa-h{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin:4px 0 -4px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:112px;padding:14px;border:0;border-radius:18px;color:#fff;text-align:left;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.qa button b{font-family:var(--cond);font-size:21px;line-height:1.05;letter-spacing:.01em}
.qa button span.s{font-size:12.5px;opacity:.88;margin-top:auto}
.qa button .ico{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.qa button .ico svg{width:22px;height:22px}
.qa button .ok{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;background:rgba(255,255,255,.95);color:#0B1324;border-radius:99px;padding:2px 8px}
.qa .q1{background:linear-gradient(140deg,#21B57E,#127552)}
.qa .q2{background:linear-gradient(140deg,#3D8BFD,#1F4FB8)}
.qa .q3{background:linear-gradient(140deg,var(--acc),#5A0A12)}
.qa .q4{background:linear-gradient(140deg,#9B6BFF,#5530B8)}
.sec{display:flex;gap:12px;align-items:center}
.sec .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.sec .si svg{width:24px;height:24px}
.sec p{margin:2px 0 0;color:var(--sub);font-size:13.5px}
.tcard{border-left:5px solid var(--tc,var(--acc))}
.tcard .trk2 i{background:var(--tc,var(--acc))!important}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tc);margin-right:7px;vertical-align:1px}

/* Cuestionario: la conversación se desplaza por dentro y la última pregunta queda siempre a la vista */
.flow{height:calc(100vh - 54px);height:calc(100dvh - 54px - env(safe-area-inset-top,0px));min-height:0!important;overflow:hidden}
.flow .fl-msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.flow .fl-top{position:relative;top:auto}
.flow .fl-in{position:relative;bottom:auto;flex:none}
@media (min-width:1000px){.flow{height:100vh}}

button.av{border:0;cursor:pointer;padding:0}
.set-list{display:flex;flex-direction:column;padding:6px 16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:15px}
.set-row span span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.set-row i{font-style:normal;font-weight:700;color:var(--acc)}
body.big #client{zoom:1.15}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* acceso */
body.locked .shell{visibility:hidden}
#gate{position:fixed;inset:0;z-index:100;background:#0B1F3A;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
#gate[hidden]{display:none}
.g-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.g-logo .glogo{height:22px;margin-bottom:18px}
#gate h1{font-family:var(--cond);font-size:34px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em}
.g-sub{color:#B9C6DA;font-size:15px;margin:0 0 6px}
#gForm{display:flex;flex-direction:column;gap:8px}
#gForm label{font-size:13px;font-weight:700;color:#DCE5F2;margin-top:6px}
#gForm input{height:52px;border-radius:14px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:17px;font-weight:600;padding:0 16px;outline:none}
#gForm input:focus{border-color:#6CC4F0}
#gCode{letter-spacing:.12em;text-transform:uppercase}
.g-err{min-height:20px;color:#FFB4A6;font-size:14px;margin:4px 0 0}
.g-btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;border:0;background:#6CC4F0;color:#0B1F3A;font-weight:800;font-size:16px;text-decoration:none;margin-top:4px}
.g-btn:disabled{opacity:.6}
.g-btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.25)}
.g-foot{color:#7F93B2;font-size:12px;margin-top:18px;text-align:center}

/* ===== v2 · Pista: marino profundo, tartán rojo y líneas de calle ===== */
:root{--paper:#08122B;--card:#0F1C3D;--card-2:#172852;--line:rgba(255,255,255,.1);--ink:#F2F5FA;--sub:#9FB0CC;--chalk:#F4F1EA}
html{background:#060E22}
body{background:radial-gradient(700px 380px at 110% -10%,var(--glow,rgba(215,25,42,.28)),transparent 65%),linear-gradient(180deg,#0B1736 0%,#060E22 70%);background-attachment:fixed;background-color:#060E22}
.card,.tcard,.kpi,.stat,.box{background:var(--card);border:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:18px}
.hdr{background:transparent;border-bottom:0;padding-top:16px;padding-bottom:6px;backdrop-filter:none}
.hdr .word{font-size:15px;gap:10px}
.sw-i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--sub);margin-left:2px}
h1.t{font-size:34px;text-transform:uppercase;letter-spacing:.01em}
.board{background:linear-gradient(160deg,#13244C 0%,#0D1A3A 55%,#0A1430 100%);border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.board::after{border:0;right:-30px;top:-40px;width:260px;height:260px;background:repeating-radial-gradient(circle at 100% 0,transparent 0 26px,rgba(255,255,255,.07) 26px 28px)}
.board::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--acc)}
.board .big{font-size:64px;line-height:.9}
.qa{grid-template-columns:1fr 1fr;gap:10px}
.qa button{box-shadow:none;border:1px solid var(--line);background:var(--card)!important;min-height:104px;border-radius:18px}
.qa button .ico{background:rgba(255,255,255,.07);color:var(--tc,#fff)}
.qa .q1{--tc:#3FD08A}.qa .q3{--tc:#4DA3FF}.qa .q4{--tc:#FFC23D}
.qa .q2{order:-1;grid-column:1/-1;min-height:120px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000))!important;border-color:transparent;overflow:hidden}
.qa .q2::after{content:"";position:absolute;right:-40px;top:-30px;width:220px;height:220px;background:repeating-radial-gradient(circle at 100% 0,transparent 0 22px,rgba(255,255,255,.16) 22px 24px);pointer-events:none}
.qa .q2 .ico{background:rgba(255,255,255,.2);color:#fff}
.qa .q2 b{font-size:25px}
.nav{background:rgba(6,12,30,.94);border-top:1px solid var(--line)}
.nav button.on{color:#fff}
.nav button.on svg{color:var(--acc)}
.nav button.on::before{background:var(--acc);height:3px}
.tcard{border-left-width:4px}
.focus{border-left:4px solid var(--acc)}
.chip.info{background:rgba(77,163,255,.16);color:#8CC4FF}
.chip.on-dark{background:rgba(255,255,255,.1);color:#fff}
.st{color:var(--sub)}
.bt.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.2);color:#fff;display:flex}
.sec .si{border-radius:12px}
/* ---- inicio: ¿quién entra? ---- */
body.on-entry .stage{display:none!important}
#entry[hidden]{display:none}
.en{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:radial-gradient(800px 500px at 100% 0,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%),linear-gradient(170deg,#0D1C42 0%,#081230 55%,#050B1C 100%);color:#fff}
.en-lanes{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.en-lanes path{fill:none;stroke:#fff;stroke-width:2}
.en-in{position:relative;max-width:1080px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;min-height:100vh;min-height:100dvh}
.en-top{display:flex;align-items:center;gap:12px}
.en-top img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.en-mono{width:44px;height:44px;border-radius:12px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.04em}
.en-top b{display:block;font-family:var(--cond);font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.en-top span{font-size:12.5px;color:#B8C5DC}
.en-hero{margin-top:auto}
.en-kick{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#C9D4E6}
.en-hero h1{margin:0;font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:clamp(44px,12vw,104px);line-height:.86;letter-spacing:.005em}
.en-s{margin:14px 0 0;font-size:16.5px;color:#D3DCEB;max-width:36ch}
.en-cards{display:grid;gap:14px}
.en-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.en-bib,.en-coach{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:22px;padding:18px 18px 16px;cursor:pointer;overflow:hidden;transition:transform .15s ease}
.en-bib:active,.en-coach:active{transform:scale(.985)}
.en-bib{background:var(--chalk);color:#0B1736;box-shadow:0 20px 50px rgba(0,0,0,.45);padding-top:30px}
.en-bib .holes{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between}
.en-bib .holes i{width:9px;height:9px;border-radius:50%;background:#0B1736;opacity:.85}
.en-band{align-self:stretch;margin:0 -18px;padding:7px 18px;background:var(--acc);color:var(--on-acc);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.en-num{font-family:var(--cond);font-weight:700;font-size:92px;line-height:.9;letter-spacing:-.01em;margin-top:8px}
.en-name{font-family:var(--cond);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.en-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13.5px;color:#46536D}
.en-meta b{font-family:var(--cond);font-size:22px;color:#0B1736;margin-right:3px}
.en-go{margin-top:14px;align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;border-top:2px dashed rgba(11,23,54,.25);padding-top:12px}
.en-go i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#0B1736;color:#fff}
.en-coach{background:linear-gradient(160deg,#16295A,#0E1B3D);color:#fff;border:1px solid rgba(255,255,255,.14)}
.en-coach .en-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--acc)}
.en-k{margin-top:12px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B8C5DC}
.en-cn{font-family:var(--cond);font-weight:700;font-size:40px;text-transform:uppercase;line-height:1;margin-top:4px}
.en-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.en-stats span{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;font-size:13px;color:#C9D4E6}
.en-stats b{font-family:var(--cond);font-size:19px;color:#fff;margin-right:3px}
.en-stats .hot{background:color-mix(in srgb,var(--acc) 30%,transparent)}
.en-coach .en-go{border-top-color:rgba(255,255,255,.18)}
.en-coach .en-go i{background:var(--acc);color:var(--on-acc)}
.en-link{border:0;background:none;color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px;align-self:center;font-size:14.5px}
.en-note{margin:0;font-size:13px;color:#AFBCD3;padding:0 6px}
.en-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;font-size:12px;color:#93A3BE;text-align:center}
.en-foot button{border:0;background:none;color:#fff;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:2px;padding:4px}
.en-foot button.red{color:#FF8A8D}
.en-foot .pw{display:inline-flex;align-items:center;gap:6px;flex-basis:100%;justify-content:center}
.en-foot .glogo{height:11px}
@media (min-width:860px){
  .en-in{padding-top:34px;gap:30px}
  .en-hero{margin-top:6vh}
  .en-cards{grid-template-columns:1.1fr 1fr;align-items:start;margin-top:auto}
  .en-coach{min-height:100%}
}
/* ---- cambiar de vista ---- */
.home-b{display:flex;align-items:center;gap:8px;height:34px!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:10px!important;background:rgba(255,255,255,.06)!important;color:#fff!important;font-size:13px;font-weight:700;padding:0 10px!important;margin-bottom:12px;width:max-content}
@media (max-width:999px){
  .side{top:0!important;align-items:center;scrollbar-width:none;background:rgba(6,12,30,.96)!important}
  .side::-webkit-scrollbar{display:none}
  .home-b{margin:0 4px 0 0}
  body{overflow-x:clip}
}
@media (min-width:1000px){
  #paneC .hdr{position:sticky;top:0;z-index:4;background:rgba(8,18,43,.9);backdrop-filter:blur(12px)}
}
/* ---- entreno ---- */

  function normCode(v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function hashCode(code) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode('galerna|' + normCode(code))).then(function (buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }); }
  function fetchList() { return fetch('acceso.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(function (j) { CONTACTO = j.contacto || null; return j.accesos || []; }); }
  function findE(list, h) { return list.filter(function (x) { return x.clave === h; })[0]; }
  function contactBtn() { var wa = CONTACTO ? String(CONTACTO.whatsapp || '').replace(/[^0-9]/g, '') : ''; return wa ? '<a class="g-btn" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('Hola, he probado la demo de la app y quiero hablar de la versión completa') + '" target="_blank" rel="noopener">Escribir por WhatsApp</a>' : ''; }
  function showGate(mode, msg) {
    document.body.classList.add('locked'); gate.hidden = false;
    var top = '<div class="g-card"><div class="g-logo">' + GLOGO + '</div>';
    if (mode === 'login') gate.innerHTML = top + '<h1>Tu demo privada</h1><p class="g-sub">Entra con el código que te hemos enviado. Probarás la app como uno de tus opositores.</p><form id="gForm" novalidate><label for="gCode">Código de acceso</label><input id="gCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX"><label for="gName">Tu nombre</label><input id="gName" autocomplete="given-name" placeholder="Cómo quieres que te llame la app"><p class="g-err" id="gErr" role="alert">' + esc(msg || '') + '</p><button type="submit" class="g-btn" id="gGo">Entrar</button></form><p class="g-foot">Galerna Method · demo para academias</p></div>';
    else gate.innerHTML = top + '<h1>' + (mode === 'expired' ? 'Tu prueba ha terminado' : mode === 'offline' ? 'Necesitas conexión' : 'Este acceso ya no está activo') + '</h1><p class="g-sub">' + esc(mode === 'offline' ? 'Conéctate a internet un momento para comprobar tu acceso.' : 'Gracias por probar la app. Si la quieres para tu academia, hablamos.') + '</p>' + contactBtn() + (mode === 'offline' ? '<button type="button" class="g-btn ghost" data-gretry="1">Reintentar</button>' : '<button type="button" class="g-btn ghost" data-gnew="1">Tengo otro código</button>') + '<p class="g-foot">Galerna Method · demo para academias</p></div>';
  }
  function openApp() { document.body.classList.remove('locked'); gate.hidden = true; gate.innerHTML = ''; }
  function verify() {
    var t = S.trial; if (!t || !t.h) { showGate('login'); return; }
    fetchList().then(function (list) {
      var E = findE(list, t.h);
      if (!E || E.activo === false) { showGate('off'); return; }
      if (expired(E.caduca)) { showGate('expired'); return; }
      t.exp = E.caduca || ''; t.ok = Date.now();
      var b = S.brand, ch = false;
      [['centro', 'name'], ['entrenador', 'coach'], ['ciudad', 'city'], ['logo', 'logo']].forEach(function (q) { if ((E[q[0]] || '') !== (b[q[1]] || '') && (E[q[0]] || q[0] === 'logo')) { b[q[1]] = E[q[0]] || ''; ch = true; } });
      if (hexOk(E.primario) && b.primary !== E.primario) { b.primary = E.primario; ch = true; }
      if (hexOk(E.acento) && b.accent !== E.acento) { b.accent = E.acento; ch = true; }
      if (ch) { applyBrand(); renderC(); renderA(); if (UI.mobile === 'entry') $('entry').innerHTML = vEntry(); }
      save(); openApp();
    }).catch(function () { if (expired(t.exp)) showGate('expired'); else if (Date.now() - (t.ok || 0) < 3 * 864e5) openApp(); else showGate('offline'); });
  }
  gate.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = normCode($('gCode').value), name = $('gName').value.trim(), err = $('gErr'), go = $('gGo');
    if (code.length < 6) { err.textContent = 'Escribe el código tal y como te lo hemos enviado.'; return; }
    if (!name) { err.textContent = 'Dinos cómo te llamas para personalizar tu app.'; return; }
    go.disabled = true; go.textContent = 'Comprobando…'; err.textContent = '';
    hashCode(code).then(function (h) {
      return fetchList().then(function (list) {
        var E = findE(list, h);
        if (!E || E.activo === false) throw new Error('Ese código no es válido o ya no está activo.');
        if (expired(E.caduca)) throw new Error('Ese código ya ha caducado.');
        S = seedState(E, name, h); upgrade(); save(); applyBrand(); UI.c = 'splash'; UI.a = 'resumen'; UI.flow = null; renderC(); renderA(); openApp();
      }, function () { throw new Error('No hay conexión. Conéctate a internet para entrar la primera vez.'); });
    }).catch(function (x) { err.textContent = x && x.message ? x.message : 'No se ha podido comprobar el código.'; go.disabled = false; go.textContent = 'Entrar'; });
  });
  gate.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; if (b.dataset.gretry) verify(); if (b.dataset.gnew) { try { localStorage.removeItem(KEY); } catch (x) {} S = seedState(null, '', ''); applyBrand(); showGate('login'); } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.trial && S.trial.h) verify(); });
  verify();
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
