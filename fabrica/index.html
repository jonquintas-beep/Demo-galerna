<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Fábrica del Ejercicio</title>
<meta name="description" content="Demo de la app para gimnasios de Galerna Method">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Fábrica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{height:100%}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: en escritorio, la app del cliente (móvil) junto al panel del centro; en el móvil, un selector cambia entre las dos. La marca (colores, nombre) llega desde el enlace */
:root{
  color-scheme: light;
  --navy:#14213D; --navy-2:#22335A; --blue:#2D5BA8; --peach:#F2A65A; --peach-soft:#FCEBDA; --on-accent:#13203A;
  --bg:#F5F3EF; --card:#FFFFFF; --ink:#13203A; --sub:#5A6478; --faint:#8A93A6; --line:#E4E0D8;
  --ok:#2E7D5B; --ok-soft:#E3F2EA; --warn:#B4610E; --warn-soft:#FCEBD8; --bad:#B42318; --bad-soft:#FBE4E1;
  --wa:#1F8F5A;
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9E5DE;color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Estructura ---------- */
.shell{height:100%;display:flex;flex-direction:column}
.switch{flex:none;display:none;gap:4px;margin:8px max(12px, env(safe-area-inset-right,0px)) 8px max(12px, env(safe-area-inset-left,0px));padding:4px;border-radius:999px;background:#D9D4CA}
.switch button{flex:1;height:38px;border-radius:999px;font-weight:700;font-size:13px;color:var(--sub)}
.switch button.on{background:var(--navy);color:#fff}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:410px minmax(0,1fr);gap:28px;padding:20px max(24px, env(safe-area-inset-right,0px)) 20px max(24px, env(safe-area-inset-left,0px));max-width:1500px;width:100%;margin:0 auto}
.pane{min-height:0;display:flex;flex-direction:column}
.cap{flex:none;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin:0 0 10px 6px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--peach);flex:none}
.phone{flex:1;min-height:0;border-radius:46px;background:var(--bg);box-shadow:0 0 0 10px #0B0F18,0 40px 90px -30px rgba(15,30,54,.55);overflow:hidden;position:relative;display:flex;flex-direction:column;max-height:880px}
.admin{flex:1;min-height:0;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 30px 70px -40px rgba(15,30,54,.45);overflow:hidden;display:grid;grid-template-columns:232px minmax(0,1fr);position:relative}
@media (max-width: 1080px){
  body{background:var(--bg)}
  .switch{display:flex}
  .stage{display:block;padding:0;max-width:none}
  .pane{height:100%}
  .pane[data-hidden="true"]{display:none}
  .cap{display:none}
  .phone{border-radius:0;box-shadow:none;max-height:none}
  .admin{border-radius:0;box-shadow:none;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
}

/* ---------- Comunes ---------- */
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:50;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:#E6EEFA;color:var(--blue)} .chip.mute{background:#EEEBE5;color:var(--sub)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- App cliente ---------- */
.c-view{flex:1;min-height:0;display:flex;flex-direction:column}
.c-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.c-scroll::-webkit-scrollbar{display:none}
.c-scroll > *{flex-shrink:0}
.c-hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.word-s{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-align:left}
.word-s span{color:var(--peach)}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--peach);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--sub);height:40px;align-self:flex-start}
.title{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-.02em;line-height:1.1}
.subt{color:var(--sub);font-size:14px;margin-top:3px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 0 0 1px var(--line)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h h3{font-family:var(--display);font-weight:600;font-size:16px}
.card-h span{font-size:12.5px;color:var(--sub);text-align:right}
.hero{background:var(--navy);color:#F7F4EE;border-radius:26px 26px 26px 8px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle, var(--peach), transparent 70%);opacity:.5;pointer-events:none}
.hero > *{position:relative;z-index:1}
.pill{align-self:flex-start;background:var(--peach);color:var(--on-accent);font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px}
.hero h2{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.15}
.hero p{color:#D4DAE6;font-size:14px}
.row2{display:flex;gap:8px}
.bt{height:46px;border-radius:999px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;text-align:center}
.bt.peach{background:var(--peach);color:var(--on-accent)}
.bt.navy{background:var(--navy);color:#fff}
.bt.ghost-l{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#F7F4EE}
.bt.ghost{box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.bt.full{width:100%}
.bt[aria-disabled="true"]{opacity:.45}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.ring svg{width:62px;height:62px}
.ring b{font-size:14px}
.ring span{font-size:11.5px;color:var(--sub)}
.note-c{display:flex;gap:10px;align-items:flex-start}
.note-c p{font-size:14px;line-height:1.45}
.bub{border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;line-height:1.42;background:var(--bg);white-space:pre-line}
.bub.me{background:var(--navy);color:#F7F4EE;border-radius:16px 16px 4px 16px;align-self:flex-end;max-width:82%}
.bub.bot{align-self:flex-start;max-width:88%;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.bub.coach{align-self:flex-start;max-width:88%;background:var(--peach-soft)}
.bub .tag{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--blue)}
.bub .tag.esc{color:var(--warn)}
.bub .who{display:block;font-size:11.5px;font-weight:700;color:var(--warn);margin-bottom:2px}
.c-nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 8px 10px;background:var(--card);border-top:1px solid var(--line)}
.c-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;font-size:11px;font-weight:700;color:var(--faint)}
.c-nav button.on{color:var(--navy)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:#E9E5DE}
.seg button{height:36px;border-radius:999px;font-weight:700;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.week{display:flex;flex-direction:column}
.wd{display:flex;align-items:center;gap:12px;padding:11px 4px;width:100%;text-align:left}
.wd + .wd{border-top:1px solid var(--line)}
.wd .d{width:44px;height:44px;flex:none;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13px;line-height:1.1}
.wd.today .d{background:var(--navy);color:var(--peach)}
.wd .t{flex:1;min-width:0}
.wd .t b{display:block;font-size:15px}
.wd .t span{display:block;font-size:12.5px;color:var(--sub)}
.wd.rest .t b{color:var(--faint);font-weight:600}
.ex{display:flex;align-items:center;gap:12px;padding:12px 0}
.ex + .ex{border-top:1px solid var(--line)}
.ex i{width:44px;height:44px;flex:none;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--blue);font-size:13px}
.ex p{flex:1;font-weight:600}
.ex p span{display:block;font-weight:500;font-size:12.5px;color:var(--sub)}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.goal{background:var(--bg);border-radius:16px;padding:12px;min-width:0}
.goal span{display:block;font-size:11.5px;color:var(--sub)}
.goal b{display:block;font-family:var(--display);font-weight:600;font-size:16px;margin-top:4px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:10px;font-size:14px;line-height:1.4}
.rules li::before{content:"";width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--peach);flex:none}
.meal{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px}
.meal + .meal{border-top:1px solid var(--line)}
.meal b{flex:none;width:72px;font-size:12.5px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 0 0 1px var(--line);min-width:0}
.kpi span{display:block;font-size:11.5px;color:var(--sub)}
.kpi b{display:block;font-family:var(--display);font-weight:600;font-size:19px;margin-top:4px}
.kpi small{display:block;font-size:11.5px;color:var(--ok);font-weight:700;margin-top:2px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat i{aspect-ratio:1;border-radius:6px;background:#EDE9E2;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.q{display:flex;flex-direction:column;gap:10px}
.q + .q{border-top:1px solid var(--line);padding-top:14px}
.q h4{font-family:var(--display);font-weight:600;font-size:15px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button,.opts button{min-height:42px;border-radius:12px;background:var(--bg);font-weight:700;font-size:13px;color:var(--sub)}
.scale button.on,.opts button.on{background:var(--navy);color:#fff}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{padding:0 14px}
.scale-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--bg);font-size:22px;font-weight:600}
.stepper b{font-family:var(--display);font-weight:600;font-size:28px;min-width:90px;text-align:center}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.compose{flex:none;display:flex;align-items:center;gap:6px;margin:0 14px 12px;height:52px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);padding:0 5px 0 16px}
.compose input{flex:1;min-width:0;border:0;background:none;font-size:16px;outline:none;height:44px}
.send{width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--peach);display:grid;place-items:center;flex:none}
.sugg{flex:none;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;height:34px;padding:0 13px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--sub)}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;border-radius:16px 16px 16px 4px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.bar{height:8px;border-radius:999px;background:#EDE9E2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--peach)}
.rank{display:flex;align-items:center;gap:12px;padding:10px 4px}
.rank + .rank{border-top:1px solid var(--line)}
.rank .pos{width:26px;font-family:var(--display);font-weight:600;color:var(--sub);text-align:center}
.rank.me{background:var(--peach-soft);border-radius:12px;padding:10px 8px}
.rank .tx{flex:1;min-width:0}
.rank .tx b{display:block;font-size:14px}
.rank .v{font-weight:800;font-size:14px}

/* Portada */
.splash{flex:1;display:flex;flex-direction:column;background-color:var(--navy);background:radial-gradient(ellipse 90% 60% at 80% 18%, color-mix(in srgb, var(--peach) 45%, transparent), transparent 60%),radial-gradient(ellipse 80% 60% at 10% 90%, rgba(45,91,168,.45), transparent 65%),var(--navy);color:#F7F4EE;padding:36px 24px 26px;position:relative;overflow:hidden}
.splash .rg{position:absolute;right:-90px;top:90px;width:380px;height:380px;opacity:.5;pointer-events:none;color:var(--peach)}
.badge-s{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600}
.badge-s b{color:var(--peach)}
.word{margin-top:auto;font-family:var(--display);font-weight:700;font-size:clamp(28px,9vw,40px);letter-spacing:.02em;line-height:1.02;text-transform:uppercase;overflow-wrap:anywhere}
.word span{color:var(--peach)}
.tagline{margin-top:14px;font-family:var(--display);font-weight:300;font-size:22px;line-height:1.25;max-width:17ch}
.svc{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.svc span{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#E6E2DA}
.addr{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#C3CBDA}
.glogo{height:14px;width:auto;display:block}

/* ---------- Panel ---------- */
.a-side{background:var(--navy);color:#DCE3F0;padding:20px 12px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto;scrollbar-width:thin}
.a-brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:#fff;padding:0 10px;text-transform:uppercase}
.a-brand span{color:var(--peach)}
.a-who{font-size:12.5px;color:#AEBBD2;padding:2px 10px 14px}
.a-grp{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8C9BB8;padding:12px 12px 4px}
.a-side button{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;border-radius:11px;font-weight:600;font-size:13.5px;color:#C8D3E6;text-align:left;width:100%;flex:none}
.a-side button.on{background:rgba(255,255,255,.12);color:#fff}
.a-side button .n{margin-left:auto;background:var(--peach);color:var(--on-accent);font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}
.a-side .spacer{flex:1;min-height:10px}
.a-side .reset{font-size:12.5px;color:#AEBBD2}
.a-side .pow{font-size:11px;color:#8C9BB8;padding:10px 12px 0;display:flex;flex-direction:column;gap:6px}
.a-side .pow .glogo{height:16px;opacity:.9}
.a-main{min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 28px 40px;background:#FBFAF7}
.a-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.a-head h2{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em}
.a-head p{color:var(--sub);font-size:14px;margin-top:4px;max-width:70ch}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 0 0 1px var(--line);min-width:0}
.box h3{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.box h3 small{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--sub)}
.stat span{display:block;font-size:12.5px;color:var(--sub)}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:28px;margin-top:4px}
.stat small{display:block;font-size:12px;color:var(--ok);font-weight:700;margin-top:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.li + .li{border-top:1px solid var(--line)}
.li .tx{flex:1;min-width:180px}
.li .tx b{display:block;font-size:14.5px}
.li .tx span{display:block;font-size:12.5px;color:var(--sub)}
.avs{width:36px;height:36px;border-radius:50%;background:var(--peach-soft);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F5F1}
.form{display:flex;flex-direction:column;gap:12px}
.lab{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--sub)}
.inp,.sel,.ta{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;height:42px;font-size:14px;font-weight:500;color:var(--ink)}
.ta{height:auto;min-height:84px;padding:10px 12px;line-height:1.45;resize:vertical}

<script>
(function () {
  /* ================= Utilidades ================= */
  var DAYS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  var DAYS_L = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dow(d) { return (d.getDay() + 6) % 7; }
  function fmt(d, o) { return d.toLocaleDateString('es-ES', o || { weekday: 'long', day: 'numeric', month: 'long' }); }
  function short(d) { return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', ''); }
  function nf(n, dec) { return Number(n).toLocaleString('es-ES', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
  function initials(n) { return String(n).split(' ').filter(Boolean).map(function (p) { return p[0]; }).join('').slice(0, 2).toUpperCase(); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function weeksSince(s) { return Math.max(1, Math.floor((today() - parse(s)) / 864e5 / 7) + 1); }

  }
  function toastA(t) { UI.toastA = t; refreshA(); clearTimeout(UI.ta); UI.ta = setTimeout(function () { UI.toastA = ''; refreshA(); }, 2600); }
  function readSessions(fd, n) {
    var out = [];
    for (var i = 0; i < n; i++) { if (fd.get('s' + i + '-title') == null) continue; out.push({ day: +fd.get('s' + i + '-day'), title: String(fd.get('s' + i + '-title')).trim() || 'Sesión', detail: String(fd.get('s' + i + '-detail') || '').trim(), ex: [] }); }
    return out;
  }
  function lines(s) { return String(s || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }
  function editingTarget() { return UI.a === 'tpl' ? tplById(UI.aTpl) : client(UI.aClient); }
  function syncSessionsFromForm() {
    var form = document.getElementById(UI.a === 'tpl' ? 'tplForm' : 'fichaForm'); if (!form) return;
    var tgt = editingTarget(), old = tgt.sessions, ns = readSessions(new FormData(form), old.length);
    ns.forEach(function (s, i) { s.ex = old[i] ? old[i].ex : []; }); tgt.sessions = ns;
  }
  function syncRules() {
    var f = document.getElementById('rulesForm'); if (!f) return;
    var fd = new FormData(f);
    S.assistant.rules = S.assistant.rules.map(function (r, i) { return { id: r.id, topic: String(fd.get('r' + i + '-topic') || '').trim() || 'Tema', keys: String(fd.get('r' + i + '-keys') || '').trim(), answer: String(fd.get('r' + i + '-answer') || '').trim() }; });
  }
  function setBrand(nb) {
    var oldCoach = S.brand.coach;
    S.brand = nb;
    if (S.assistant.name === oldCoach) S.assistant.name = nb.coach;
    if (S.team[0] && S.team[0].name === oldCoach) S.team[0].name = nb.coach;
    save(); applyBrand(); renderC(); refreshA();
  }

  aRoot.addEventListener('click', function (e) {
    var b = e.target.closest('button, tr[data-open]'); if (!b) return;
    var d = b.dataset;
    if (d.login) { S.me = d.login; S.scope = 'all'; save(); var ml = mine(); UI.a = 'resumen'; UI.aClient = ml[0] && ml[0].id; UI.waC = null; UI.sts = null; UI.compose = null; renderA(); var mm = aRoot.querySelector('.a-main'); if (mm) mm.scrollTop = 0; return; }
    if (d.logout) { S.me = null; save(); renderA(); return; }
    if (d.scope) { S.scope = d.scope; save(); UI.waC = null; UI.sts = null; renderA(); return; }
    if (d.vaopen) { vaOpen(d.vaopen, 'entrenador'); return; }
    if (d.vaextra) { var cx = client(d.vaextra); cx.vaExtra = cx.vaExtra || {}; cx.vaExtra[vaMonth()] = (cx.vaExtra[vaMonth()] || 0) + 1; save(); renderA(); renderC(); toastA('Análisis extra para ' + first(cx.name) + ' este mes'); return; }
    if (crmPanelClick(b, d)) return;
    if (stPanelClick(b, d)) return;
    if (d.a) {
      if (d.a === 'reset') { S = seed(S.brand); stSeedAll(); crmSeed(); vaSeed(); save(); applyBrand(); UI.a = 'resumen'; UI.c = 'splash'; UI.compose = null; UI.waC = null; renderA(); renderC(); return; }
      if (d.pre) UI.pre = d.pre;
      if (d.a === 'nuevo' && !d.keep) UI.prefill = null;
      UI.a = d.a; UI.test = ''; renderA(); aRoot.querySelector('.a-main').scrollTop = 0; return;
    }
    if (d.open) { UI.aClient = d.open; UI.a = 'ficha'; renderA(); return; }
    if (d.ftab) { UI.ftab = d.ftab; renderA(); return; }
    if (d.ftry) { startFlow(d.ftry); setMobile('c'); return; }
    if (d.view) { S.active = d.view; save(); UI.c = 'home'; UI.draft = null; renderC(); setMobile('c'); return; }
    if (d.tpl) { UI.aTpl = d.tpl; UI.a = 'tpl'; renderA(); return; }
    if (d.al) { S.dismissed.push(d.al); save(); refreshA(); return; }
    if (d.wa) {
      var al = alerts().filter(function (x) { return x.id === d.wa; })[0]; if (!al) return;
      var rule = autoRule(al.type);
      UI.compose = { aid: al.id, cid: al.c.id, type: al.type, text: fillTpl(rule ? rule.tpl : 'Hola {nombre}, ¿qué tal?', al.c, { zona: al.zona }) };
      refreshA(); var t = document.getElementById('waText'); if (t) t.focus({ preventScroll: true }); return;
    }
    if (d.wacancel) { UI.compose = null; refreshA(); return; }
    if (d.thread) { UI.waC = d.thread; UI.a = 'whatsapp'; renderA(); return; }
    if (d.consent) { client(d.consent).waOk = true; save(); refreshA(); toastA('Consentimiento registrado'); return; }
    if (d.runauto) { runAuto(); return; }
    if (d.addsess) { syncSessionsFromForm(); editingTarget().sessions.push({ day: 5, title: 'Nueva sesión', detail: 'Detalle', ex: [] }); refreshA(); return; }
    if (d.delsess) { syncSessionsFromForm(); editingTarget().sessions.splice(+d.delsess, 1); refreshA(); return; }
    if (d.delesc) { S.assistant.escalate.splice(+d.delesc, 1); save(); refreshA(); return; }
    if (d.addrule) { syncRules(); S.assistant.rules.push({ id: uid(), topic: 'Nuevo tema', keys: '', answer: '' }); refreshA(); return; }
    if (d.delrule) { syncRules(); S.assistant.rules.splice(+d.delrule, 1); save(); refreshA(); return; }
    if (d.lead) {
      var ld = S.leads.filter(function (x) { return x.id === d.lead; })[0]; if (!ld) return;
      ld.fresh = false;
      if (d.to === 'valoracion') { ld.stage = 'valoracion'; ld.when = 'Ahora mismo'; ld.bot = 'Valoración reservada. El asistente le confirmó la hora por ' + (ld.src === 'Instagram' ? 'Instagram' : 'WhatsApp') + '.'; save(); refreshA(); toastA('Valoración reservada para ' + first(ld.name)); return; }
      if (d.to === 'cliente') { UI.prefill = { name: ld.name, goal: ld.goal, leadId: ld.id }; UI.a = 'nuevo'; renderA(); aRoot.querySelector('.a-main').scrollTop = 0; return; }
    }
    if (d.pal) { var p = PALETTES[+d.pal], nb = clone(S.brand); nb.primary = p.p; nb.accent = p.a; setBrand(nb); toastA('Colores aplicados: ' + p.n); return; }
    if (d.copy) {
      var txt = document.getElementById('tokenTxt').textContent;
      var done = function () { toastA('Copiado. Pégalo al final del enlace de la demo.'); };
      try { navigator.clipboard.writeText(txt).then(done, function () { selectToken(); }); } catch (err) { selectToken(); }
      return;
    }
    if (d.cheer) {
      var bd = S.challenge.board.slice().sort(function (x, y) { return y.v - x.v; }), n = 0;
      S.clients.forEach(function (c) { if (!c.waOk) return; var pos = 0; bd.forEach(function (r, i) { if (r.n === c.name) pos = i + 1; }); if (!pos) return; sendWA(c, '¡Vamos, ' + first(c.name) + '! Vas el ' + pos + 'º en el ' + S.challenge.name.toLowerCase() + '. Esta semana puedes subir puestos.', { tpl: 'Reto del mes', kind: 'reto' }); n++; });
      toastA(n + ' mensajes de ánimo enviados'); return;
    }
  });
  function selectToken() { var el = document.getElementById('tokenTxt'); if (!el) return; var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toastA('Texto seleccionado: cópialo con el menú del móvil'); }
  aRoot.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.open) { UI.aClient = e.target.dataset.open; UI.a = 'ficha'; renderA(); } });
  aRoot.addEventListener('change', function (e) {
    if (crmPanelChange(e)) return;
    var d = e.target.dataset || {};
    if (d.fon || d.ftext) { var pr = (d.fon || d.ftext).split(':'), fqq = S.forms[pr[0]].filter(function (x) { return x.id === pr[1]; })[0]; if (!fqq) return; if (d.fon) { fqq.on = e.target.checked; save(); refreshA(); } else { fqq.text = e.target.value; save(); toastA('Pregunta guardada'); } return; }
    if (d.autoon) { autoRule(d.autoon).on = e.target.checked; save(); refreshA(); return; }
    if (d.automode) { autoRule(d.automode).mode = e.target.value; save(); refreshA(); return; }
    if (d.autoparam) { autoRule(d.autoparam).param = +e.target.value; save(); refreshA(); return; }
    if (d.autotpl) { autoRule(d.autotpl).tpl = e.target.value; save(); toastA('Mensaje actualizado'); return; }
    if (e.target.id === 'hours') { S.auto.hours = e.target.value; save(); toastA('Horario de envío actualizado'); return; }
    if (e.target.id === 'tone') { S.assistant.tone = e.target.value; save(); toastA('Tono actualizado'); return; }
    if (e.target.id === 'aname') { S.assistant.name = e.target.value.trim() || S.brand.coach; save(); renderC(); toastA('Nombre actualizado'); return; }
    if (e.target.id === 'coachSel') { client(UI.aClient).coach = e.target.value; save(); renderC(); toastA('Entrenador asignado'); return; }
    if (e.target.id === 'chOn') { S.challenge.on = e.target.checked; save(); renderC(); toastA(S.challenge.on ? 'Reto visible en la app' : 'Reto oculto en la app'); return; }
    if (e.target.id === 'fee') { S.fee = Math.max(0, +e.target.value || 0); save(); refreshA(); return; }
  });
  aRoot.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, fd = new FormData(f);
    if (vaPanelSubmit(f)) return;
    if (crmPanelSubmit(f)) return;
    if (stPanelSubmit(f)) return;
    if (f.id === 'fichaForm') {
      var c = client(UI.aClient);
      c.sessions = readSessions(fd, c.sessions.length).map(function (s, i) { s.ex = (c.sessions[i] && c.sessions[i].ex) || []; return s; });
      c.nutrition.protein = fd.get('protein'); c.nutrition.water = fd.get('water'); c.nutrition.kcal = fd.get('kcal'); c.nutrition.rules = lines(fd.get('rules'));
      c.rest = lines(fd.get('rest')); c.targets.sleep = +fd.get('sleepT') || c.targets.sleep; c.note = fd.get('note');
      save(); renderC(); toastA('Guardado. ' + first(c.name) + ' ya lo ve en su app.');
    } else if (f.id === 'tplForm') {
      var t = tplById(UI.aTpl);
      t.name = fd.get('name') || t.name; t.weeks = +fd.get('weeks') || t.weeks; t.goal = fd.get('goal');
      t.sessions = readSessions(fd, t.sessions.length).map(function (s, i) { s.ex = (t.sessions[i] && t.sessions[i].ex) || []; return s; });
      t.nutrition.protein = fd.get('protein'); t.nutrition.water = fd.get('water'); t.nutrition.rules = lines(fd.get('rules')); t.rest = lines(fd.get('rest'));
      save(); toastA('Plantilla guardada');
    } else if (f.id === 'rulesForm') { syncRules(); save(); toastA('Pautas guardadas. El asistente ya responde así.');
    } else if (f.id === 'escForm') { var w = document.getElementById('escIn').value.trim(); if (w) { S.assistant.escalate.push(w); document.getElementById('escIn').value = ''; save(); refreshA(); }
    } else if (f.id === 'testForm') { UI.test = document.getElementById('testIn').value.trim(); refreshA();
    } else if (f.id === 'teamForm') {
      var tn = String(fd.get('name') || '').trim(); if (!tn) return;
      S.team.push({ id: 'c' + uid(), name: tn, role: String(fd.get('role') || '').trim() || 'Entrenador/a' }); save(); refreshA(); toastA(tn + ' ya está en el equipo');
    } else if (f.id === 'chForm') {
      S.challenge.name = String(fd.get('name') || '').trim() || S.challenge.name; S.challenge.goal = Math.max(1, +fd.get('goal') || S.challenge.goal); S.challenge.unit = String(fd.get('unit') || '').trim() || S.challenge.unit;
      save(); renderC(); toastA('Reto guardado');
    } else if (f.id === 'brandForm') {
      var nb = clone(S.brand);
      nb.name = String(fd.get('name') || '').trim() || nb.name; nb.coach = String(fd.get('coach') || '').trim() || nb.coach; nb.city = String(fd.get('city') || '').trim() || nb.city;
      nb.tagline = String(fd.get('tagline') || '').trim() || nb.tagline; nb.services = String(fd.get('services') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 6);
      if (hexOk(fd.get('primary'))) nb.primary = fd.get('primary'); if (hexOk(fd.get('accent'))) nb.accent = fd.get('accent');
      setBrand(nb); UI.c = 'splash'; renderC(); toastA('Marca aplicada. Mira la portada de la app.');
    } else if (f.id === 'newForm') {
      var name = String(fd.get('name') || '').trim(); if (!name) return;
      var tpl = tplById(fd.get('tpl')), wv = parseFloat(fd.get('w')) || 70;
      var nc = { id: uid(), name: name, goal: String(fd.get('goal') || '').trim() || tpl.goal, start: iso(T), coach: fd.get('coach') || 'c1', waOk: !!fd.get('wa'), weight: [wv], strength: { name: (tpl.sessions[0].ex[0] || { n: 'Fuerza' }).n, unit: 'kg', vals: [10] }, checks: [], done: 0, note: fd.get('note'), chat: [],
        tpl: tpl.id, planName: tpl.name, weeks: tpl.weeks, sessions: clone(tpl.sessions), nutrition: clone(tpl.nutrition), rest: clone(tpl.rest), targets: clone(tpl.targets) };
      S.clients.push(nc); S.active = nc.id; UI.aClient = nc.id; UI.a = 'ficha'; UI.c = 'splash'; UI.draft = null;
      if (UI.prefill && UI.prefill.leadId) { var lead = S.leads.filter(function (x) { return x.id === UI.prefill.leadId; })[0]; if (lead) { lead.stage = 'cliente'; lead.fresh = false; lead.when = 'Ahora mismo'; lead.bot = 'Ya es cliente con el plan ' + tpl.name + '.'; } }
      UI.prefill = null; save(); renderA(); renderC();
      toastA(first(name) + ' ya tiene su app con el plan ' + tpl.name);
    } else if (f.id === 'waCompose') {
      var cc = client(UI.compose.cid), tx = document.getElementById('waText').value.trim(), rl = autoRule(UI.compose.type);
      if (!tx) return;
      document.getElementById('waText').value = '';
      S.dismissed.push(UI.compose.aid);
      sendWA(cc, tx, { tpl: rl ? rl.name : '', kind: UI.compose.type });
      UI.compose = null; save(); toastA('WhatsApp enviado a ' + first(cc.name) + '. Mira su respuesta en WhatsApp.');
    } else if (f.id === 'waManual') {
      var inp = document.getElementById('waManualIn'), mt = inp.value.trim(); if (!mt) return;
      inp.value = ''; sendWA(client(UI.waC), mt, { kind: 'manual' }); refreshA();
    } else if (f.dataset.inbox) {
      var id = f.dataset.inbox, item = S.inbox.filter(function (x) { return x.id === id; })[0], txt = f.querySelector('input').value.trim();
      if (!item || !txt) return;
      item.done = true;
      if (item.ch === 'wa') sendWA(client(item.client), txt, {}); else client(item.client).chat.push({ k: 'coach', t: txt });
      save(); renderC(); refreshA(); toastA('Respuesta enviada');
    }
  });

  /* ================= Selector móvil ================= */
  var swC = document.getElementById('swC'), swA = document.getElementById('swA');
  function setMobile(v) {
    UI.mobile = v;
    swC.classList.toggle('on', v === 'c'); swA.classList.toggle('on', v === 'a');
    swC.setAttribute('aria-selected', v === 'c'); swA.setAttribute('aria-selected', v === 'a');
    document.getElementById('paneC').dataset.hidden = v !== 'c';
    document.getElementById('paneA').dataset.hidden = v !== 'a';
  }
  swC.addEventListener('click', function () { setMobile('c'); });
  swA.addEventListener('click', function () { setMobile('a'); });
  window.addEventListener('hashchange', function () { var h2 = parseHash(); if (h2 && tokenFor(h2) !== tokenFor(S.brand)) { S = seed(h2); save(); applyBrand(); UI.c = 'splash'; UI.a = 'resumen'; renderC(); renderA(); } });
  setMobile('c');
  renderC(); renderA();
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
